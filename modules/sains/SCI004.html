(function(){
const d=sourceData, root=document.getElementById('app');let idx=0;let ans={};let checked={};let cards={};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>E(s).replace(/\n/g,'<br>');
function button(id,t,cls=''){return `<button type="button" id="${id}" class="btn ${cls}">${t}</button>`}
/* Kawalan wajib jawab: semua jenis item termasuk padanan dan susunan kad. */
let jpnOrderTouched = Object.create(null);
function jpnIsAnswered(it){
 const v=ans[it.id];
 if(it.type==='order')return jpnOrderTouched[it.id]===true && Array.isArray(v) && v.length===(it.options||[]).length;
 if(it.type==='single'||it.type==='number'||it.type==='text')return String(v??'').trim().length>0;
 if(it.type==='multi')return Array.isArray(v)&&v.length>0;
 if(it.type==='match')return Array.isArray(v)&&v.length===(it.options||[]).length&&v.every(x=>String(x??'').trim()!=='');
 return Array.isArray(v)?v.length>0:v!==null&&v!==undefined&&String(v).trim()!=='';
}
function jpnWarnRequired(it){
 const box=document.getElementById('response');if(!box)return;
 const old=document.getElementById('jpn-required-message');if(old)old.remove();
 box.insertAdjacentHTML('afterend','<div id="jpn-required-message" role="alert" style="margin-top:12px;padding:12px 14px;background:#fff1e5;border:2px solid #d25e0d;border-radius:12px;color:#7c2d12;font-weight:700;line-height:1.5">⚠️ Sila lengkapkan jawapan soalan ini sebelum meneruskan. Jawapan tidak semestinya betul.</div>');
}
function jpnHideRequired(){const x=document.getElementById('jpn-required-message');if(x)x.remove();}
function jpnGoNext(it){
 capture(it);
 if(it&&!jpnIsAnswered(it)){jpnWarnRequired(it);return;}
 if(it && idx===d.items.length){
   const missing=d.items.find(x=>!jpnIsAnswered(x));
   if(missing){jpnWarnRequired(it);return;}
 }
 idx++;render();
}
function capture(it){if(!it)return;const box=document.getElementById('response');if(!box)return;let o=it.options||[];
if(it.type==='single')ans[it.id]=o[Number(box.querySelector('input:checked')?.value)]||'';
else if(it.type==='multi')ans[it.id]=[...box.querySelectorAll('input:checked')].map(x=>o[Number(x.value)]);
else if(it.type==='order')ans[it.id]=(cards[it.id]||o).slice();
else if(it.type==='match')ans[it.id]=[...box.querySelectorAll('select')].map(x=>x.value);
else ans[it.id]=box.querySelector('textarea,input')?.value??'';
}
function status(it){const v=ans[it.id],target=String(it.answer||'').trim();let ok=false,has=false;
if(it.type==='single'){has=!!v;ok=String(v||'').trim().startsWith(target+'.') || String(v||'').trim()===target}
else if(it.type==='multi'){has=Array.isArray(v)&&v.length>0;const actual=(v||[]).map(x=>String(x).trim().split('.')[0]).sort().join(',');const expected=target.split(',').map(x=>x.trim()).sort().join(',');ok=has&&actual===expected}
else if(it.type==='number'){has=String(v??'').trim()!=='';ok=has&&Number(String(v).trim())===Number(target)}
else if(it.type==='order'){has=Array.isArray(v);ok=has&&v.join(', ')===target}
else if(it.type==='text'){has=!!String(v??'').trim();ok=null}
else{has=!!v;ok=null}return {ok,has};}
function feedback(it){if(!checked[it.id])return '';const st=status(it);if(!st.has)return `<div class="feedback bad" role="status"><b>Jawapan belum lengkap.</b>Sila berikan jawapan sebelum menyemak.</div>`;
let h=st.ok===true?'<div class="feedback" role="status"><b>Betul!</b>Jawapan anda tepat.':st.ok===false?'<div class="feedback bad" role="status"><b>Jawapan belum tepat.</b>Semak semula maklumat stimulus dan jawapan anda.':'<div class="feedback neutral" role="status"><b>Jawapan telah direkodkan.</b>Bandingkan penerangan anda dengan contoh jawapan di bawah.';h+='</div>';
let explanation=String(it.help||'').trim();h+=`<div class="details"><b>Konsep dan penerangan</b>${explanation?`<p>${nl(explanation)}</p>`:''}${st.ok!==true?`<p><b>${it.type==='text'?'Contoh jawapan':'Jawapan yang tepat'}:</b> ${nl(it.answer)}</p>`:''}</div>`;return h;}
function response(it){let o=it.options||[],v=ans[it.id];if(it.type==='single'||it.type==='multi')return `<div class="options">${o.map((x,j)=>`<label class="option"><input type="${it.type==='single'?'radio':'checkbox'}" name="answer" value="${j}" ${(it.type==='single'&&v===x)||(it.type==='multi'&&Array.isArray(v)&&v.includes(x))?'checked':''}> <span>${E(x)}</span></label>`).join('')}</div>`;
if(it.type==='order')return `<p class="muted">Gunakan butang NAIK dan TURUN yang berwarna untuk menyusun kad planet.</p><div class="cards" id="cards"></div>`;
if(it.type==='match')return o.map((x,j)=>`<label>${E(x.split('|')[0]||'Pasangan '+(j+1))}<select data-match="${j}" class="field"><option value="">Pilih pasangan</option>${o.map(y=>{const z=y.split('|')[1]||y;return `<option ${v&&v[j]===z?'selected':''}>${E(z)}</option>`}).join('')}</select></label>`).join('');
return it.type==='number'?`<input class="field" type="text" inputmode="decimal" aria-label="Jawapan nombor" value="${E(v||'')}" placeholder="Masukkan nombor sahaja">`:`<textarea class="field textarea" aria-label="Jawapan bertulis" placeholder="Tulis jawapan anda">${E(v||'')}</textarea>`;}
function paintCards(it){const o=it.options||[],c=cards[it.id]||(cards[it.id]=Array.isArray(ans[it.id])?ans[it.id].slice():o.slice());const box=document.getElementById('cards');if(!box)return;box.innerHTML=c.map((x,j)=>`<div class="planet-card"><span class="card-label">${E(x)}</span><button type="button" class="btn reorder-btn reorder-up" data-dir="-1" data-i="${j}" ${j===0?'disabled':''} aria-label="Naikkan ${E(x)}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span>NAIK</span></button><button type="button" class="btn reorder-btn reorder-down" data-dir="1" data-i="${j}" ${j===c.length-1?'disabled':''} aria-label="Turunkan ${E(x)}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg><span>TURUN</span></button></div>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i),j=i+Number(b.dataset.dir);[c[i],c[j]]=[c[j],c[i]];ans[it.id]=c.slice();jpnOrderTouched[it.id]=true;jpnHideRequired();checked[it.id]=false;paintCards(it);document.getElementById('result').innerHTML='';});}
function render(){const it=d.items[idx-1],isIntro=idx===0,isEnd=idx>d.items.length;
let main;if(isIntro){main=`<div class="intro-shell"><div class="panel"><span class="pill">Pengenalan</span><h2>${E(d.title)}</h2><p class="muted">${E(d.subject)} · ${E(d.grade)}${d.theme?' · '+E(d.theme):''}</p><div class="intro-content">${d.image?`<div class="intro-stage"><img class="intro-img" src="${d.image}" alt="Imej senario asal"></div>`:''}<div class="intro-copy"><p class="introtext">${E(d.intro)}</p></div></div>${d.evidence?`<div class="details"><b>Maklumat untuk tugasan</b><p>${nl(d.evidence)}</p></div>`:''}</div></div>`}
else if(isEnd){main=`<div class="intro-shell"><div class="panel complete-panel"><span class="pill">Misi Selesai!</span><h2>Syabas! 🌟</h2><p class="introtext">${E(d.ending||'Terima kasih kerana melengkapkan tugasan.')}</p></div></div>`}
else{main=`<div class="grid"><section class="panel stimulus" aria-label="Stimulus Interaktif"><h2>Stimulus Interaktif</h2><div class="stimulus-stage">${it.image?`<img src="${it.image}" alt="Imej asal ${E(it.title)}">`:''}<div class="desc"><p>${nl(it.context)}</p></div></div></section><section class="panel question" aria-label="Soalan"><span class="pill">Item ${idx} / ${d.items.length}</span><h2>${E(it.title||'Langkah '+idx)}</h2><p class="statement">${E(it.prompt)}</p><div id="response">${response(it)}</div><div id="result"></div></section></div>`}
root.innerHTML=`<div class="main">${main}</div><div class="footer"><span class="step">${isIntro?'Pengenalan':isEnd?'Selesai':`Langkah ${idx} daripada ${d.items.length}`}</span><div class="buttons" style="margin-top:0">${isEnd?`${button('home','Halaman Utama','secondary')}${button('restart','Cuba Semula')}`:`${button('back','Kembali','secondary')}${button('next',idx===d.items.length?'Selesai':'Seterusnya')}`}</div></div>`;
if(isEnd){document.getElementById('home').onclick=()=>{idx=0;render()};document.getElementById('restart').onclick=()=>{idx=0;ans={};checked={};cards={};jpnOrderTouched=Object.create(null);render()};}else{const back=document.getElementById('back'),next=document.getElementById('next');back.disabled=isIntro;back.onclick=()=>{capture(it);idx--;render()};next.onclick=()=>jpnGoNext(it);}
if(it){if(it.type==='order')paintCards(it);
const box=document.getElementById('response');box.addEventListener('input',()=>{capture(it);jpnHideRequired();checked[it.id]=false;document.getElementById('result').innerHTML=''});box.addEventListener('change',()=>{capture(it);jpnHideRequired();checked[it.id]=false;document.getElementById('result').innerHTML=''});
}
}
render();
window.JPN_V2_ALL_COMPLETE=function(){return d.items.every(jpnIsAnswered);};
/* JPN V2: akses baca sahaja kepada jawapan dan halaman semasa. */
window.JPN_V2_EXPORT=function(){return {unitId:'SCI004',version:'psi-v1',page:idx>d.items.length?5:(idx===0?0:1),answers:JSON.parse(JSON.stringify(ans))};};

})();

    hostOrigin=event.origin;hostNonce=msg.nonce;lastPage=null;
    notify(true);
  } else if(msg.type==='JPN_V2_COLLECT'&&event.origin===hostOrigin&&msg.nonce===hostNonce){respond();}
 });
 const app=document.getElementById('app');
 if(app)new MutationObserver(()=>notify(false)).observe(app,{childList:true,subtree:true,characterData:true});
})();
</script>
