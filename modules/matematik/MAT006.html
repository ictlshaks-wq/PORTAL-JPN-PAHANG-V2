'use strict';
const KEY='MAT006_KARNIVAL_SUKAN_SCI001';
const items=moduleData.items;
let page=0,answers={};
try{const prior=JSON.parse(localStorage.getItem(KEY)||'{}');if(prior && typeof prior==='object')answers=prior}catch(e){}
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatText=x=>escapeHtml(x).replace(/\n/g,'<br>');
const shortTitle='Karnival Sukan Sekolah';
const records=[['Bola sepak','36'],['Bola jaring','28'],['Badminton','24'],['Olahraga','32']];
function table(rows,headers){return `<table class="info-table">${headers?`<thead><tr>${headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>`:''}<tbody>${rows.map(row=>`<tr>${row.map((s,j)=>`<td>${escapeHtml(s)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function media(item){if(item.image && item.image.startsWith('data:image/'))return `<div class="visual-paper"><img class="visual-art" src="${item.image}" alt="Bahan rangsangan bagi ${escapeHtml(item.title)}"></div>`;return ''}
function stimulus(){const item=items[page-1];if(!item)return '';
 let extras='';
 if(page===2)extras=table(records,['Aktiviti sukan','Bilangan murid']);
 if(page===5)extras=table([['Murid 1','3 250 cm'],['Murid 2','3 025 cm'],['Murid 3','3 520 cm'],['Murid 4','3 205 cm']],['Peserta','Jarak lontaran']);
 return `<h2>${escapeHtml(item.title)}</h2>${media(item)}${extras?`<div class="paper">${extras}</div>`:''}<div class="paper"><p class="context">${formatText(item.context)}</p></div>`;
}
function response(item){const val=answers[item.id];
 if(item.type==='single'||item.type==='multi')return `<div>${item.options.map((o,j)=>`<label class="mat-choice"><input type="${item.type==='single'?'radio':'checkbox'}" name="r" value="${j}" ${(item.type==='single'&&val===o)||(item.type==='multi'&&Array.isArray(val)&&val.includes(o))?'checked':''}><span>${escapeHtml(o)}</span></label>`).join('')}</div>`;
 if(item.type==='order'){const order=Array.isArray(val)&&val.length===item.options.length?val:item.options;return `<p class="small">Gunakan butang NAIK dan TURUN untuk menyusun mengikut arahan.</p><div id="sort">${order.map((o,i)=>`<div class="sort-row"><strong>${i+1}. ${escapeHtml(o)}</strong><span><button data-at="${i}" data-move="-1" ${i===0?'disabled':''}>▲ NAIK</button><button data-at="${i}" data-move="1" ${i===order.length-1?'disabled':''}>▼ TURUN</button></span></div>`).join('')}</div>`}
 if(item.type==='match'){const options=item.options.map(x=>x.split('|')[1]?.trim()||x.trim());const values=Array.isArray(val)?val:[];return `<div>${item.options.map((o,i)=>`<div class="match-row"><label for="match-${i}">${escapeHtml(o.split('|')[0].trim())}</label><select id="match-${i}" data-match="${i}"><option value="">Pilih jawapan</option>${options.map(v=>`<option value="${escapeHtml(v)}" ${values[i]===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}</select></div>`).join('')}</div>`}
 if(item.type==='number')return `<label for="numeric" class="small">Jawapan (mililiter)</label><input id="numeric" class="answer" type="number" step="any" inputmode="decimal" min="0" placeholder="Masukkan nombor" value="${escapeHtml(val??'')}">`;
 return `<label for="typed" class="small">Tulis penerangan anda</label><textarea id="typed" class="mat-textarea" placeholder="Tulis jawapan dan sebab anda di sini">${escapeHtml(val??'')}</textarea>`;
}
function save(k,v){answers[k]=v;try{localStorage.setItem(KEY,JSON.stringify(answers))}catch(e){}notify()}
function capture(){const item=items[page-1];if(!item)return;const root=document.getElementById('app');
 if(item.type==='single'){const x=root.querySelector('input[name="r"]:checked');if(x)save(item.id,item.options[Number(x.value)])}
 else if(item.type==='multi')save(item.id,[...root.querySelectorAll('input[name="r"]:checked')].map(x=>item.options[Number(x.value)]));
 else if(item.type==='match')save(item.id,[...root.querySelectorAll('[data-match]')].map(x=>x.value));
 else if(item.type==='text')save(item.id,root.querySelector('#typed')?.value??'');
 else if(item.type==='number')save(item.id,root.querySelector('#numeric')?.value??'');
 else if(item.type==='order'&&!Array.isArray(answers[item.id]))save(item.id,[...item.options]);
}

// Gunakan ruang sebenar setiap panel: isi ruang yang kosong, namun tidak potong maklumat.
function fitPanelImage(pane){
 if(!pane)return;
 const body=pane.querySelector('.stimulus-body');
 const img=pane.querySelector('.visual-art');
 if(!body)return;
 pane.classList.remove('is-fitted');
 const styles=getComputedStyle(pane);
 const inset=(parseFloat(styles.paddingTop)||0)+(parseFloat(styles.paddingBottom)||0);
 const available=pane.clientHeight-inset;
 if(available<80)return;
 if(img){
   // Kurangkan gambar terlebih dahulu untuk mengukur ruang teks dan jadual sebenar.
   img.style.height='1px'; img.style.maxHeight='none';
   const fixed=Math.max(0,body.scrollHeight-1);
   const margin=8;
   const room=Math.max(48,available-fixed-margin);
   const visualWidth=img.getBoundingClientRect().width||pane.clientWidth;
   const imageRatio=img.naturalWidth>0&&img.naturalHeight>0?img.naturalHeight/img.naturalWidth:1;
   const naturalSize=Math.max(48,visualWidth*imageRatio);
   // Isi ruang panel, setakat tinggi yang diperlukan oleh gambar pada lebar penuh.
   const target=Math.max(48,Math.min(room,naturalSize));
   img.style.height=target+'px';
   // Biar elemen membesar/membalut semula, kemudian kecilkan hanya jika tersisa limpahan.
   for(let i=0;i<3;i++){
     const excess=body.scrollHeight-available;
     if(excess<=1)break;
     const h=img.getBoundingClientRect().height;
     img.style.height=Math.max(45,h-excess-5)+'px';
   }
 }
 if(body.scrollHeight<=available+3)pane.classList.add('is-fitted');
}

function render(){const app=document.getElementById('app'),foot=document.getElementById('footer'),item=items[page-1];

 foot.innerHTML=`<span class="steptext">Langkah ${page} daripada ${items.length}</span><div class="actions"><button class="btn secondary" id="back">Kembali</button><button class="btn" id="next">Seterusnya</button></div>`;
 }

 document.getElementById('next')?.addEventListener('click',()=>goto(page+1));
 document.getElementById('home')?.addEventListener('click',()=>{page=0;render();try{window.parent.postMessage({source:'JPN_MODULE_V2',kind:'home',code:'MAT006'},'*')}catch(e){}});

  app.querySelectorAll('input[name="r"]').forEach(el=>el.addEventListener('change',()=>{capture();if(item.type==='multi'||item.type==='single')render()}));

/* JPN V2 MATHEMATICS: additive required-answer guard + safe export. */
const __matCode='MAT006';
const __matTouched=new Set();
const __matAnswered=x=>{
  if(x===null||x===undefined)return false;
  if(typeof x==='string')return x.trim()!=='';
  if(typeof x==='number')return Number.isFinite(x);
  if(typeof x==='boolean')return true;
  if(Array.isArray(x))return x.length>0&&x.every(__matAnswered);
  if(typeof x==='object')return Object.keys(x).length>0&&Object.values(x).every(__matAnswered);
  return false;
};
const __matStep=()=>page;
const __matTotal=()=>items.length;
const __matGet=(i)=>answers[items[i-1]?.id];
const __matCurrent=()=>{
  const p=__matStep();if(p<1||p>__matTotal())return true;
  const value=__matGet(p);
  // Select fields on the active screen; each distinct response must be filled.
  const root=document.getElementById('screen')||document.getElementById('app')||document.getElementById('response')||document;
  const groups=[...root.querySelectorAll('.choices[data-key]')];
  if(groups.length&&groups.some(el=>!__matAnswered((answers)[el.dataset.key])))return false;
  const typed=[...root.querySelectorAll('input[data-key],textarea[data-key]')];
  if(typed.length&&typed.some(el=>!String(el.value??'').trim()))return false;
  if(items[p-1]?.type==='order'&&!__matTouched.has(p))return false;
  if(items[p-1]?.type==='chart-dnd'){
    const expected=items[p-1]?.answer;
    if(!value||typeof value!=='object'||!expected||typeof expected!=='object')return false;
    return Object.keys(expected).every(k=>__matAnswered(value[k]));
  }
  return __matAnswered(value);
};
window.JPN_V2_ALL_COMPLETE=()=>Array.from({length:__matTotal()},(_,i)=>i+1).every(i=>{
 const v=__matGet(i); const t=items[i-1]?.type;
 if(t==='order'&&!__matTouched.has(i))return false;
 if(t==='chart-dnd'){
   const e=items[i-1]?.answer;
   return Boolean(e&&v&&Object.keys(e).every(k=>__matAnswered(v[k])));
 }
 return __matAnswered(v);
});
window.JPN_V2_EXPORT=()=>({
 unitId:__matCode,version:'mat-v2-required',page:__matStep()>__matTotal()?5:(__matStep()===0?0:1),
 answers:Object.fromEntries(Array.from({length:__matTotal()},(_,i)=>[('Q'+(i+1)+'.'+__matCode),__matGet(i+1)??null]))
});
const __matAlert=()=>{
 let a=document.getElementById('__mat_wajib_jawab_alert');
 if(!a){a=document.createElement('div');a.id='__mat_wajib_jawab_alert';a.setAttribute('role','alert');
 a.style.cssText='position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:999999;padding:13px 18px;background:#fff0c4;color:#643b00;border:2px solid #e7a62d;border-radius:12px;box-shadow:0 5px 18px #0002;font:700 15px Poppins,Arial,sans-serif;max-width:92vw;text-align:center';document.body.appendChild(a)}
 a.textContent='Sila lengkapkan semua jawapan pada langkah ini sebelum meneruskan. Jawapan tidak semestinya betul.';
 setTimeout(()=>{if(a.isConnected)a.remove()},4500);
};
// Capture BEFORE existing button click handlers. No original handler/feature is removed.
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.matches('[data-move]')&&!b.disabled)__matTouched.add(__matStep());
 if(!b.matches('#next,#goNext'))return;
 if(__matStep()===0||__matStep()>__matTotal())return;
 if(!__matCurrent()||(__matStep()===__matTotal()&&!window.JPN_V2_ALL_COMPLETE())){
   e.preventDefault();e.stopImmediatePropagation();__matAlert();
 }
},true);

render();
</script>
<script>
/* JPN PAHANG V2 - postMessage bridge compatible with current Apps Script Index.html. */
(function(){'use strict';
 const CODE='MAT006';let origin='',nonce='',last=null;
 function get(){try{return window.JPN_V2_EXPORT?.()||null}catch(e){return null}}
 function notify(force){if(!origin||!nonce)return;const v=get();if(!v)return;
  if(force||v.page!==last){last=v.page;parent.postMessage({type:'psi-page',page:v.page},origin)}}
 function collect(){if(!origin||!nonce||!window.JPN_V2_ALL_COMPLETE?.())return;
  const v=get();if(!v||v.page!==5)return;
  parent.postMessage({type:'JPN_V2_COMPLETE',moduleId:CODE,nonce,response:v},origin)}
 window.addEventListener('message',e=>{
  if(e.source!==parent||!e.data||typeof e.data!=='object')return;
  const d=e.data;
  if(d.type==='JPN_V2_INIT'&&d.moduleId===CODE&&typeof d.nonce==='string'&&d.nonce.length>=8){origin=e.origin;nonce=d.nonce;last=null;notify(true)}
  else if(d.type==='JPN_V2_COLLECT'&&e.origin===origin&&d.nonce===nonce)collect();
 });
 new MutationObserver(()=>notify(false)).observe(document.body,{childList:true,subtree:true});
})();
</script>
