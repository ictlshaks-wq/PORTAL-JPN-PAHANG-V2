.panel{min-height:0;min-width:0;border:1.5px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;padding:9px 10px}
.stimulus{background:var(--pale)}.question{background:#fff}.panel-heading{margin:0 0 8px;flex:0 0 auto;font-size:clamp(15px,1.2vw,18px);font-weight:800;color:#075187;line-height:1.35}

const pages=[{"title":"Pengenalan","left":"<div class=\"sheet\"><div class=\"tag\">SITUASI</div><h2>Ruang pembelajaran baharu</h2><div data-visual=\"intro\"></div><p>Ruang pembelajaran akan digunakan pada <strong>Khamis minggu kedua</strong>.</p></div>","right":"<div class=\"tag\">MISI AINA</div><h1>Bantu Aina menyediakan ruang pembelajaran</h1><p>Aina membantu guru menyemak bahan, pemasangan, jadual kerja dan tempat duduk.</p><p class=\"question\">Bantu Aina menyelesaikan enam tugasan.</p>"},{"title":"Semak jubin lantai","left":"<div class=\"sheet\"><h2>Pelan sudut aktiviti</h2><div class=\"plan-summary\"><strong>8 jubin sebaris</strong></div><div class=\"plan-schematic\" role=\"img\" aria-label=\"Pelan mempunyai 6 baris jubin. Setiap baris memerlukan 8 jubin.\"><div class=\"plan-row\"><span>Baris 1</span><div class=\"plan-band\" aria-hidden=\"true\"></div></div><div class=\"plan-row\"><span>Baris 2</span><div class=\"plan-band\" aria-hidden=\"true\"></div></div><div class=\"plan-row\"><span>Baris 3</span><div class=\"plan-band\" aria-hidden=\"true\"></div></div><div class=\"plan-row\"><span>Baris 4</span><div class=\"plan-band\" aria-hidden=\"true\"></div></div><div class=\"plan-row\"><span>Baris 5</span><div class=\"plan-band\" aria-hidden=\"true\"></div></div><div class=\"plan-row\"><span>Baris 6</span><div class=\"plan-band\" aria-hidden=\"true\"></div></div></div></div><div data-visual=\"tiles\"></div>","right":"<div class=\"tag\">TUGASAN 1</div><h1>Pilih pesanan jubin</h1><p class=\"question\">Pesanan manakah cukup untuk pelan ini tanpa jubin berlebihan?</p><div class=\"choices\" data-key=\"q1\"><button type=\"button\" class=\"choice\" data-val=\"42 keping\">42 keping</button><button type=\"button\" class=\"choice\" data-val=\"48 keping\">48 keping</button><button type=\"button\" class=\"choice\" data-val=\"56 keping\">56 keping</button><button type=\"button\" class=\"choice\" data-val=\"64 keping\">64 keping</button></div>"},{"title":"Semak kotak bekalan","left":"<div class=\"sheet\"><h2>Nota penghantaran</h2><p class=\"small\">Penghantaran ini meliputi beberapa bahagian ruang pembelajaran.</p><table><tbody><tr><th>Jubin dihantar</th><td>72 keping</td></tr><tr><th>Jubin dalam satu kotak</th><td>8 keping</td></tr></tbody></table></div><div data-visual=\"box\"></div>","right":"<div class=\"tag\">TUGASAN 2</div><h1>Semak bilangan kotak</h1><p class=\"question\">Berapakah kotak jubin yang dihantar?</p><div class=\"choices\" data-key=\"q2\"><button type=\"button\" class=\"choice\" data-val=\"8 kotak\" aria-pressed=\"false\">8 kotak</button><button type=\"button\" class=\"choice\" data-val=\"9 kotak\" aria-pressed=\"false\">9 kotak</button><button type=\"button\" class=\"choice\" data-val=\"10 kotak\" aria-pressed=\"false\">10 kotak</button><button type=\"button\" class=\"choice\" data-val=\"12 kotak\" aria-pressed=\"false\">12 kotak</button></div>"},{"title":"Semak panel dinding","left":"<div class=\"sheet\"><h2>Rekod pemasangan panel</h2><table><thead><tr><th>Hari</th><th>Panel dipasang</th></tr></thead><tbody><tr><td>Pertama</td><td>15 keping</td></tr><tr><td>Kedua</td><td>9 keping</td></tr></tbody></table><p class=\"rule\">Laporan kepada guru menyatakan <strong>25 panel</strong> telah dipasang.</p></div><div data-visual=\"panel\"></div>","right":"<div class=\"tag\">TUGASAN 3</div><h1>Semak laporan panel</h1><p class=\"question\">Berapakah jumlah panel sebenar yang telah dipasang?</p><div class=\"response\"><label for=\"panel-answer\">Jumlah panel</label><input id=\"panel-answer\" type=\"number\" inputmode=\"numeric\" min=\"0\" step=\"1\" data-key=\"q3\" placeholder=\"Masukkan bilangan\" autocomplete=\"off\" aria-label=\"Jumlah panel sebenar\"><span class=\"unit\">keping</span></div>"},{"title":"Semak bekalan cat","left":"<div class=\"sheet\"><h2>Bekalan cat</h2><table><tbody><tr><th>Cat diperlukan</th><td>24 liter</td></tr><tr><th>Isi padu satu tin</th><td>5 liter</td></tr></tbody></table><p class=\"small\">Cat dijual dalam tin penuh sahaja.</p><div data-visual=\"paint\"></div></div>","right":"<div class=\"tag\">TUGASAN 4</div><h1>Pilih bilangan tin</h1><p class=\"question\">Berapakah bilangan tin paling sedikit yang diperlukan?</p><div class=\"choices\" data-key=\"q4\"><button type=\"button\" class=\"choice\" data-val=\"4 tin\" aria-pressed=\"false\">4 tin</button><button type=\"button\" class=\"choice\" data-val=\"5 tin\" aria-pressed=\"false\">5 tin</button><button type=\"button\" class=\"choice\" data-val=\"6 tin\" aria-pressed=\"false\">6 tin</button><button type=\"button\" class=\"choice\" data-val=\"7 tin\" aria-pressed=\"false\">7 tin</button></div>"},{"title":"Semak tempoh kerja","left":"<div class=\"sheet\"><h2>Jadual kerja</h2><table><tbody><tr><th>Mula</th><td>Isnin minggu pertama</td></tr><tr><th>Tempoh</th><td>8 hari bekerja</td></tr><tr><th>Hari bekerja</th><td>Isnin–Jumaat</td></tr></tbody></table><p class=\"small\">Hari mula ialah hari pertama.</p><h2 class=\"subhead\">Kalendar kerja</h2><div class=\"calendar-wrap\"><table class=\"calendar\"><thead><tr><th>Minggu</th><th>Isn</th><th>Sel</th><th>Rab</th><th>Kha</th><th>Jum</th></tr></thead><tbody><tr><th>1</th><td class=\"start\">Mula</td><td></td><td></td><td></td><td></td></tr><tr><th>2</th><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div></div><div data-visual=\"calendar\"></div>","right":"<div class=\"tag\">TUGASAN 5</div><h1>Tentukan hari siap</h1><p class=\"question\">Pada hari manakah kerja hari kelapan selesai?</p><div class=\"choices\" data-key=\"q5\"><button type=\"button\" class=\"choice\" data-val=\"Selasa minggu kedua\" aria-pressed=\"false\">Selasa minggu kedua</button><button type=\"button\" class=\"choice\" data-val=\"Rabu minggu kedua\" aria-pressed=\"false\">Rabu minggu kedua</button><button type=\"button\" class=\"choice\" data-val=\"Khamis minggu kedua\" aria-pressed=\"false\">Khamis minggu kedua</button><button type=\"button\" class=\"choice\" data-val=\"Jumaat minggu kedu const KEY='psi_ruang_pembelajaran_MAT004_induk_v1';
let step=0;let answers={};
try{const a=JSON.parse(localStorage.getItem(KEY)||'{}');if(a&&typeof a==='object')answers=a}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(answers))}catch(e){}}
const screen=document.getElementById('screen'),footer=document.getElementById('footer');
function render(){
 const p=pages[step];
 if(step===0){
  screen.innerHTML=`<section class="intro"><span class="intro-label">Pengenalan</span><h2>Misi Menyediakan Ruang Pembelajaran</h2><p class="intro-meta">Matematik · Tahun 3</p><div class="intro-content"><div class="intro-left">${addVisuals(p.left)}</div><div class="intro-right"><div class="intro-right-inner">${addVisuals(p.right)}</div></div></div></section>`;

 }else if(step===pages.length-1){
  screen.innerHTML=`<section class="finish"><div><span class="intro-label">Misi Selesai!</span><h2>Syabas! 🌟</h2><p>Terima kasih kerana membantu Aina menyediakan ruang pembelajaran.</p></div></section>`;

  footer.innerHTML=`<span class="steptext">Langkah ${step} daripada 6</span><div class="actions"><button class="btn secondary" id="goBack">Kembali</button><button class="btn" id="goNext">Seterusnya</button></div>`;
 }
 document.getElementById('goNext')?.addEventListener('click',()=>{if(step<pages.length-1){step++;render()}});
 document.getElementById('goBack')?.addEventListener('click',()=>{if(step>0){step--;render()}});
 document.getElementById('goHome')?.addEventListener('click',()=>{step=0;render();try{parent.postMessage({source:'JPN_MODULE_V2',kind:'home',code:'MAT004'},'*')}catch(e){}});
 document.getElementById('goAgain')?.addEventListener('click',()=>{step=0;answers={};save();render()});
 screen.querySelectorAll('.choices').forEach(group=>{const key=group.dataset.key;const buttons=[...group.querySelectorAll('.choice')];buttons.forEach(b=>{b.setAttribute('aria-pressed',String(answers[key]===b.dataset.val));b.addEventListener('click',()=>{answers[key]=b.dataset.val;save();buttons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})})});
 screen.querySelectorAll('input[data-key]').forEach(input=>{input.value=answers[input.dataset.key]??'';input.addEventListener('input',()=>{answers[input.dataset.key]=input.value;save()})});
 try{parent.postMessage({source:'JPN_MODULE_V2',kind:'state',code:'MAT004',step,steps:6,complete:step===7,answers:{...answers}},'*')}catch(e){}
}

function __matPageValue(i){
 const h=pages[i]?.right||'';
 const keys=[...h.matchAll(/data-key=["']([^"']+)["']/g)].map(m=>m[1]);
 const uniq=[...new Set(keys)];
 if(!uniq.length)return null;
 return Object.fromEntries(uniq.map(k=>[k,answers[k]??null]));
}

/* JPN V2 MATHEMATICS: additive required-answer guard + safe export. */
const __matCode='MAT004';
const __matTouched=new Set();
const __matAnswered=x=>{
  if(x===null||x===undefined)return false;
  if(typeof x==='string')return x.trim()!=='';
  if(typeof x==='number')return Number.isFinite(x);
  if(typeof x==='boolean')return true;
  if(Array.isArray(x))return x.length>0&&x.every(__matAnswered);
  if(typeof x==='object')return Object.keys(x).length>0&&Object.values(x).every(__matAnswered);
  return false;
};
const __matStep=()=>step;
const __matTotal=()=>pages.length-2;
const __matGet=(i)=>__matPageValue(i);
const __matCurrent=()=>{
  const p=__matStep();if(p<1||p>__matTotal())return true;
  const value=__matGet(p);
  // Select fields on the active screen; each distinct response must be filled.
  const root=document.getElementById('screen')||document.getElementById('app')||document.getElementById('response')||document;
  const groups=[...root.querySelectorAll('.choices[data-key]')];
  if(groups.length&&groups.some(el=>!__matAnswered((answers)[el.dataset.key])))return false;
  const typed=[...root.querySelectorAll('input[data-key],textarea[data-key]')];
  if(typed.length&&typed.some(el=>!String(el.value??'').trim()))return false;
  if(''==='order'&&!__matTouched.has(p))return false;
  if(''==='chart-dnd'){
    const expected=null?.answer;
    if(!value||typeof value!=='object'||!expected||typeof expected!=='object')return false;
    return Object.keys(expected).every(k=>__matAnswered(value[k]));
  }
  return __matAnswered(value);
};
window.JPN_V2_ALL_COMPLETE=()=>Array.from({length:__matTotal()},(_,i)=>i+1).every(i=>{
 const v=__matGet(i); const t='';
 if(t==='order'&&!__matTouched.has(i))return false;
 if(t==='chart-dnd'){
   const e=null?.answer;
   return Boolean(e&&v&&Object.keys(e).every(k=>__matAnswered(v[k])));
 }
 return __matAnswered(v);
});
window.JPN_V2_EXPORT=()=>({
 unitId:__matCode,version:'mat-v2-required',page:__matStep()>__matTotal()?5:(__matStep()===0?0:1),
 answers:Object.fromEntries(Array.from({length:__matTotal()},(_,i)=>[('Q'+(i+1)+'.'+__matCode),__matGet(i+1)??null]))
});
const __matAlert=()=>{
 let a=document.getElementById('__mat_wajib_jawab_alert');
 if(!a){a=document.createElement('div');a.id='__mat_wajib_jawab_alert';a.setAttribute('role','alert');
 a.style.cssText='position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:999999;padding:13px 18px;background:#fff0c4;color:#643b00;border:2px solid #e7a62d;border-radius:12px;box-shadow:0 5px 18px #0002;font:700 15px Poppins,Arial,sans-serif;max-width:92vw;text-align:center';document.body.appendChild(a)}
 a.textContent='Sila lengkapkan semua jawapan pada langkah ini sebelum meneruskan. Jawapan tidak semestinya betul.';
 setTimeout(()=>{if(a.isConnected)a.remove()},4500);
};
// Capture BEFORE existing button click handlers. No original handler/feature is removed.
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.matches('[data-move]')&&!b.disabled)__matTouched.add(__matStep());
 if(!b.matches('#next,#goNext'))return;
 if(__matStep()===0||__matStep()>__matTotal())return;
 if(!__matCurrent()||(__matStep()===__matTotal()&&!window.JPN_V2_ALL_COMPLETE())){
   e.preventDefault();e.stopImmediatePropagation();__matAlert();
 }
},true);

render();

  if(force||v.page!==last){last=v.page;parent.postMessage({type:'psi-page',page:v.page},origin)}}
 function collect(){if(!origin||!nonce||!window.JPN_V2_ALL_COMPLETE?.())return;
  const v=get();if(!v||v.page!==5)return;
  parent.postMessage({type:'JPN_V2_COMPLETE',moduleId:CODE,nonce,response:v},origin)}
 window.addEventListener('message',e=>{
  if(e.source!==parent||!e.data||typeof e.data!=='object')return;
  const d=e.data;
  if(d.type==='JPN_V2_INIT'&&d.moduleId===CODE&&typeof d.nonce==='string'&&d.nonce.length>=8){origin=e.origin;nonce=d.nonce;last=null;notify(true)}
  else if(d.type==='JPN_V2_COLLECT'&&e.origin===origin&&d.nonce===nonce)collect();
 });
 new MutationObserver(()=>notify(false)).observe(document.body,{childList:true,subtree:true});
})();
