let selectedChartAmount=null;
function chartValues(item){const a=answers[item.id];return a&&typeof a==='object'&&!Array.isArray(a)?a:{}}
function chartStimulus(item){const values=chartValues(item);return `<h2>Makanan yang Disukai</h2><div class="chart-building"><p class="chart-kicker">Carta palang makanan kegemaran murid</p><div class="bar-board"><div class="y-labels">${Array.from({length:9},(_,i)=>`<span>${8-i}</span>`).join('')}</div><div class="chart-plot">${CHART_FOODS.map((food,i)=>{const n=Number(values[food])||0;const pct=chartHeightPercent(n);return `<button type="button" class="drop-column" data-food="${E(food)}" aria-label="Lajur ${E(food)}: ${n||'belum diisi'} orang"><span class="bar-fill ${n?'has-value':''}" style="--bar-height:${pct}%;--bar-bg:${CHART_COLORS[i][0]};--bar-border:${CHART_COLORS[i][1]}"></span><span class="bar-figure" style="--bar-height:${pct}%">${n||''}</span></button>`}).join('')}</div><div class="chart-x-labels">${CHART_FOODS.map(food=>`<span>${E(food)}</span>`).join('')}</div></div><p class="chart-note">Bilangan murid (paksi menegak) · Jenis makanan (paksi mendatar)</p></div>`}
function chartResponse(item){const values=chartValues(item),count=Object.keys(values).length;return `<div class="chart-dnd-reference"><strong>Jadual tinjauan makanan kegemaran</strong><div class="ref-grid">${CHART_FOODS.map((food,i)=>`<span>${E(food)}</span><span>${CHART_AMOUNTS[i]} murid</span>`).join('')}</div></div><p class="dnd-help">Seret kad nombor ke lajur makanan pada carta di sebelah kiri. Pada skrin sentuh, ketik nombor kemudian ketik lajur.</p><div class="number-palette">${CHART_AMOUNTS.map(n=>`<button type="button" class="number-chip ${selectedChartAmount===n?'selected':''} ${Object.values(values).includes(n)?'allocated':''}" draggable="true" data-qty="${n}" aria-pressed="${selectedChartAmount===n}">${n}</button>`).join('')}</div><div class="chart-status" role="status" aria-live="polite"><strong>${count} / 4 palang dibina</strong><div>${count===4?'Semua palang telah dibina. Semak carta dan tekan Seterusnya.':selectedChartAmount!==null?'Nombor '+selectedChartAmount+' dipilih. Klik satu lajur pada carta.':'Pilih nombor dan bina keempat-empat palang.'}</div></div>`}
function chartPlace(item,food,amount){if(!CHART_FOODS.includes(food)||!CHART_AMOUNTS.includes(amount))return;const next={...chartValues(item)};for(const key of Object.keys(next)){if(Number(next[key])===amount)delete next[key]}next[food]=amount;selectedChartAmount=null;save(item.id,next);render()}
function bindChart(item){const app=document.getElementById('app');app.querySelectorAll('[data-qty]').forEach(chip=>{const n=Number(chip.dataset.qty);chip.addEventListener('click',()=>{selectedChartAmount=n;render()});chip.addEventListener('dragstart',event=>{event.dataTransfer.setData('text/plain',String(n));event.dataTransfer.effectAllowed='move';selectedChartAmount=n});chip.addEventListener('dragend',()=>{app.querySelectorAll('.drop-column').forEach(col=>col.classList.remove('is-over'))})});app.querySelectorAll('[data-food]').forEach(col=>{const food=col.dataset.food;col.addEventListener('click',()=>{if(selectedChartAmount!==null)chartPlace(item,food,selectedChartAmount)});col.addEventListener('dragover',event=>{event.preventDefault();event.dataTransfer.dropEffect='move';col.classList.add('is-over')});col.addEventListener('dragleave',()=>col.classList.remove('is-over'));col.addEventListener('drop',event=>{event.preventDefault();const n=Number(event.dataTransfer.getData('text/plain'));col.classList.remove('is-over');chartPlace(item,food,n)});col.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&selectedChartAmount!==null){event.preventDefault();chartPlace(item,food,selectedChartAmount)}})})}

function response(item){const val=answers[item.id];if(item.type==='chart-dnd')return chartResponse(item);
 if(item.type==='single'||item.type==='multi')return `<div>${item.options.map((o,j)=>`<label class="mat-choice"><input type="${item.type==='single'?'radio':'checkbox'}" name="response" value="${j}" ${(item.type==='single'&&val===o)||(item.type==='multi'&&Array.isArray(val)&&val.includes(o))?'checked':''}><span>${E(o)}</span></label>`).join('')}</div>`;
 if(item.type==='order'){const order=Array.isArray(val)&&val.length===item.options.length?val:item.options;return `<p class="small">Gunakan butang NAIK dan TURUN untuk menyusun mengikut arahan.</p><div id="sort">${order.map((o,i)=>`<div class="sort-row"><strong>${i+1}. ${E(o)}</strong><span><button type="button" data-at="${i}" data-move="-1" ${i===0?'disabled':''}>▲ NAIK</button><button type="button" data-at="${i}" data-move="1" ${i===order.length-1?'disabled':''}>▼ TURUN</button></span></div>`).join('')}</div>`}
 if(item.type==='match'){
  const opts=[...new Set(item.options.map(x=>x.split('|')[1]?.trim()).filter(Boolean))];const values=Array.isArray(val)?val:[];
  return item.options.map((o,i)=>`<div class="match-row"><label for="match-${i}">${E(o.split('|')[0].trim())}</label><select id="match-${i}" data-match="${i}"><option value="">Pilih jawapan</option>${opts.map(v=>`<option value="${E(v)}" ${values[i]===v?'selected':''}>${E(v)}</option>`).join('')}</select></div>`).join('')}
 if(item.type==='number')return `<label for="numeric" class="small">Jawapan (bilangan murid)</label><input id="numeric" class="answer" type="number" inputmode="decimal" step="any" placeholder="Masukkan nombor" value="${E(val??'')}">`;
 return `<label for="typed" class="small">Tulis penerangan anda</label><textarea id="typed" class="mat-textarea" placeholder="Tulis jawapan dan sebab anda di sini">${E(val??'')}</textarea>`;
}
function save(k,v){answers[k]=v;try{localStorage.setItem(KEY,JSON.stringify(answers))}catch(e){}notify()}
function capture(){const item=items[page-1];if(!item)return;if(item.type==='chart-dnd')return;const root=document.getElementById('app');
 if(item.type==='single'){const x=root.querySelector('input[name="response"]:checked');if(x)save(item.id,item.options[Number(x.value)])}
 else if(item.type==='multi')save(item.id,[...root.querySelectorAll('input[name="response"]:checked')].map(x=>item.options[Number(x.value)]));
 else if(item.type==='match')save(item.id,[...root.querySelectorAll('[data-match]')].map(x=>x.value));
 else if(item.type==='text')save(item.id,root.querySelector('#typed')?.value??'');
 else if(item.type==='number')save(item.id,root.querySelector('#numeric')?.value??'');
 else if(item.type==='order'&&!Array.isArray(answers[item.id]))save(item.id,[...item.options]);
}
// Fit gambar berdasarkan ruang baki sebenar di panel kiri; tatalan hanya jika kandungan tak boleh dimuatkan.
function fitPanel(pane){if(!pane)return;const body=pane.querySelector('.stimulus-body'),img=pane.querySelector('.visual-art');if(!body)return;
 pane.classList.remove('is-fitted');const css=getComputedStyle(pane);const available=pane.clientHeight-(parseFloat(css.paddingTop)||0)-(parseFloat(css.paddingBottom)||0);if(available<70)return;
 if(img){img.style.height='1px';img.style.maxHeight='none';const fixed=Math.max(0,body.scrollHeight-1);const room=Math.max(42,available-fixed-9);const width=img.getBoundingClientRect().width||pane.clientWidth;const ratio=img.naturalWidth?img.naturalHeight/img.naturalWidth:0.7;
 img.style.height=Math.max(42,Math.min(room,width*ratio))+'px';
 for(let i=0;i<4;i++){const excess=body.scrollHeight-available;if(excess<=1)break;img.style.height=Math.max(42,img.getBoundingClientRect().height-excess-4)+'px'}
 }
 if(body.scrollHeight<=available+3)pane.classList.add('is-fitted')
}
function fitStimulus(){fitPanel(document.querySelector('.stimulus .panel-scroll'));fitPanel(document.querySelector('.intro-panel'))}
function scheduleFit(){requestAnimationFrame(()=>{fitStimulus();requestAnimationFrame(fitStimulus)})}
window.addEventListener('resize',scheduleFit);
function notify(){try{window.parent.postMessage({source:'JPN_MODULE_V2',kind:'state',code:'MAT009',step:page,steps:items.length,complete:page===items.length+1,answers:{...answers}},'*')}catch(e){}}
function render(){const app=document.getElementById('app'),foot=document.getElementById('footer'),item=items[page-1];
 if(page===0){app.innerHTML=`<section class="intro"><span class="intro-label">Pengenalan</span><h2 class="intro-title">${E(moduleData.title)}</h2><p class="intro-meta">${E(moduleData.subject)} · ${E(moduleData.grade)}</p><div class="intro-grid"><div class="intro-panel"><div class="stimulus-body"><h2>Data Makanan Kegemaran Murid</h2>${media(items[0])}</div></div><div class="intro-panel right"><div><h2>${E(moduleData.title)}</h2><p>${E(moduleData.intro)}</p></div></div></div></section>`;
 foot.innerHTML=`<span class="steptext">Pengenalan</span><div class="actions"><button class="btn secondary" disabled>Kembali</button><button class="btn" id="next">Seterusnya</button></div>`}
 else if(page===items.length+1){app.innerHTML=`<section class="finish"><div><span class="intro-label">Misi Selesai!</span><h2>Syabas! 🌟</h2><p>${E(moduleData.ending)}</p></div></section>`;
 foot.innerHTML=`<span class="steptext">Misi Selesai</span><div class="actions"><button class="btn secondary" id="home">Halaman Utama</button><button class="btn" id="again">Cuba Semula</button></div>`}
 else{app.innerHTML=`<div class="grid"><section class="panel stimulus" data-step="${page}"><h2 class="panel-heading">🖼️ Bahan Rangsangan</h2><div class="panel-scroll"><div class="stimulus-body">${stimulus(item)}</div></div></section><section class="panel question" data-step="${page}"><div class="panel-scroll"><span class="pill">Tugasan ${page} daripada ${items.length}</span><h2 class="question-title">${E(item.title)}</h2><p class="prompt">${E(item.prompt)}</p>${response(item)}</div></section></div>`;
 foot.innerHTML=`<span class="steptext">Langkah ${page} daripada ${items.length}</span><div class="actions"><button class="btn secondary" id="back">Kembali</button><button class="btn" id="next">Seterusnya</button></div>`}
 const goto=n=>{capture();page=Math.max(0,Math.min(items.length+1,n));render()};
 document.getElementById('back')?.addEventListener('click',()=>goto(page-1));
 document.getElementById('next')?.addEventListener('click',()=>goto(page+1));
 document.getElementById('home')?.addEventListener('click',()=>{page=0;render();try{window.parent.postMessage({source:'JPN_MODULE_V2',kind:'home',code:'MAT009'},'*')}catch(e){}});
 document.getElementById('again')?.addEventListener('click',()=>{answers={};try{localStorage.removeItem(KEY)}catch(e){}page=0;render()});
 if(item){
  if(item.type==='chart-dnd')bindChart(item);
  app.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.at),j=i+Number(b.dataset.move),arr=Array.isArray(answers[item.id])?[...answers[item.id]]:[...item.options];if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];save(item.id,arr);render()}));
  app.querySelectorAll('input[name="response"]').forEach(el=>el.addEventListener('change',()=>{capture()}));
  app.querySelectorAll('[data-match]').forEach(el=>el.addEventListener('change',capture));
  app.querySelector('#numeric')?.addEventListener('input',capture);
  app.querySelector('#typed')?.addEventListener('input',capture);
 }
 notify();
 const stimulusImage=app.querySelector('.visual-art');if(stimulusImage&&!stimulusImage.complete)stimulusImage.addEventListener('load',scheduleFit,{once:true});scheduleFit()
}

/* JPN V2 MATHEMATICS: additive required-answer guard + safe export. */
const __matCode='MAT009';
const __matTouched=new Set();
const __matAnswered=x=>{
  if(x===null||x===undefined)return false;
  if(typeof x==='string')return x.trim()!=='';
  if(typeof x==='number')return Number.isFinite(x);
  if(typeof x==='boolean')return true;
  if(Array.isArray(x))return x.length>0&&x.every(__matAnswered);
  if(typeof x==='object')return Object.keys(x).length>0&&Object.values(x).every(__matAnswered);
  return false;
};
const __matStep=()=>page;
const __matTotal=()=>items.length;
const __matGet=(i)=>answers[items[i-1]?.id];
const __matCurrent=()=>{
  const p=__matStep();if(p<1||p>__matTotal())return true;
  const value=__matGet(p);
  // Select fields on the active screen; each distinct response must be filled.
  const root=document.getElementById('screen')||document.getElementById('app')||document.getElementById('response')||document;
  const groups=[...root.querySelectorAll('.choices[data-key]')];
  if(groups.length&&groups.some(el=>!__matAnswered((answers)[el.dataset.key])))return false;
  const typed=[...root.querySelectorAll('input[data-key],textarea[data-key]')];
  if(typed.length&&typed.some(el=>!String(el.value??'').trim()))return false;
  if(items[p-1]?.type==='order'&&!__matTouched.has(p))return false;
  if(items[p-1]?.type==='chart-dnd'){
    const expected=items[p-1]?.answer;
    if(!value||typeof value!=='object'||!expected||typeof expected!=='object')return false;
    return Object.keys(expected).every(k=>__matAnswered(value[k]));
  }
  return __matAnswered(value);
};
window.JPN_V2_ALL_COMPLETE=()=>Array.from({length:__matTotal()},(_,i)=>i+1).every(i=>{
 const v=__matGet(i); const t=items[i-1]?.type;
 if(t==='order'&&!__matTouched.has(i))return false;
 if(t==='chart-dnd'){
   const e=items[i-1]?.answer;
   return Boolean(e&&v&&Object.keys(e).every(k=>__matAnswered(v[k])));
 }
 return __matAnswered(v);
});
window.JPN_V2_EXPORT=()=>({
 unitId:__matCode,version:'mat-v2-required',page:__matStep()>__matTotal()?5:(__matStep()===0?0:1),
 answers:Object.fromEntries(Array.from({length:__matTotal()},(_,i)=>[('Q'+(i+1)+'.'+__matCode),__matGet(i+1)??null]))
});
const __matAlert=()=>{
 let a=document.getElementById('__mat_wajib_jawab_alert');
 if(!a){a=document.createElement('div');a.id='__mat_wajib_jawab_alert';a.setAttribute('role','alert');
 a.style.cssText='position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:999999;padding:13px 18px;background:#fff0c4;color:#643b00;border:2px solid #e7a62d;border-radius:12px;box-shadow:0 5px 18px #0002;font:700 15px Poppins,Arial,sans-serif;max-width:92vw;text-align:center';document.body.appendChild(a)}
 a.textContent='Sila lengkapkan semua jawapan pada langkah ini sebelum meneruskan. Jawapan tidak semestinya betul.';
 setTimeout(()=>{if(a.isConnected)a.remove()},4500);
};
// Capture BEFORE existing button click handlers. No original handler/feature is removed.
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.matches('[data-move]')&&!b.disabled)__matTouched.add(__matStep());
 if(!b.matches('#next,#goNext'))return;
 if(__matStep()===0||__matStep()>__matTotal())return;
 if(!__matCurrent()||(__matStep()===__matTotal()&&!window.JPN_V2_ALL_COMPLETE())){
   e.preventDefault();e.stopImmediatePropagation();__matAlert();
 }
},true);

render();
</script>
<script>
/* JPN PAHANG V2 - postMessage bridge compatible with current Apps Script Index.html. */
(function(){'use strict';
 const CODE='MAT009';let origin='',nonce='',last=null;
 function get(){try{return window.JPN_V2_EXPORT?.()||null}catch(e){return null}}
 function notify(force){if(!origin||!nonce)return;const v=get();if(!v)return;
  if(force||v.page!==last){last=v.page;parent.postMessage({type:'psi-page',page:v.page},origin)}}
 function collect(){if(!origin||!nonce||!window.JPN_V2_ALL_COMPLETE?.())return;
  const v=get();if(!v||v.page!==5)return;
  parent.postMessage({type:'JPN_V2_COMPLETE',moduleId:CODE,nonce,response:v},origin)}
 window.addEventListener('message',e=>{
  if(e.source!==parent||!e.data||typeof e.data!=='object')return;
  const d=e.data;
  if(d.type==='JPN_V2_INIT'&&d.moduleId===CODE&&typeof d.nonce==='string'&&d.nonce.length>=8){origin=e.origin;nonce=d.nonce;last=null;notify(true)}
  else if(d.type==='JPN_V2_COLLECT'&&e.origin===origin&&d.nonce===nonce)collect();
 });
 new MutationObserver(()=>notify(false)).observe(document.body,{childList:true,subtree:true});
})();
</script>
