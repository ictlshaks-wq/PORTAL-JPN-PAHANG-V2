<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misi Menyiapkan Pameran Data — PSI Matematik v10</title><style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');
:root{--deep:#07538d;--blue:#0762ae;--line:#b6ddf6;--yellow:#fff0ab;--ink:#10345b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Poppins,Arial,sans-serif;color:var(--ink);background:#e6f4ff}button,input{font-family:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,[role="button"]:focus-visible{outline:3px solid #e3aa18;outline-offset:2px}
.shell{height:calc(100dvh - 22px);min-height:500px;margin:11px 13px;background:white;border-radius:17px;overflow:hidden;display:flex;flex-direction:column;border:1px solid #c7e5f7;width:calc(100% - 26px);max-width:none;padding:0}
.head{height:62px;min-height:62px;flex:0 0 62px;background:linear-gradient(105deg,#07518e,#087db5);color:#fff;border-bottom:4px solid #edc95e;padding:8px 17px;display:flex;flex-direction:column;justify-content:center}
.head strong{font-size:clamp(16px,1.47vw,22px);font-weight:800;line-height:1.1}.head small{color:#fff1c4;font-size:12px;font-weight:700;line-height:1.35}
.screen{flex:1;min-height:0;overflow:hidden;padding:9px 10px;background:#fff}
.grid{width:100%;height:100%;min-height:0;display:grid;grid-template-columns:minmax(0,60fr) minmax(0,40fr);gap:12px}
.panel{border:1.5px solid var(--line);border-radius:15px;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.stimulus{background:#eaf6ff;padding:10px}.question{background:#fff;padding:10px}
.panel-heading{font-weight:800;font-size:clamp(16px,1.28vw,20px);color:#07538d;margin:0 0 8px;line-height:1.35}
.panel-scroll{flex:1;overflow:auto;min-height:0;min-width:0;scrollbar-width:thin;scrollbar-color:#91bfdd transparent}
.stimulus-body{display:flex;flex-direction:column;gap:10px;min-height:0}
.pill{display:block;font-size:13px;font-weight:800;color:#07518e;background:#e0f1ff;border-radius:28px;padding:6px 10px;margin:0 0 12px;line-height:1.35}
.question-title{font-size:clamp(16px,1.28vw,20px);color:#07518e;font-weight:800;line-height:1.4;margin:0 0 9px}
.prompt{font-weight:800;font-size:clamp(16px,1.35vw,20px);line-height:1.4;color:#0d2e51;margin:0 0 15px}
.choice{display:flex;gap:12px;align-items:center;width:100%;border:2px solid #b5dbf7;padding:10px 12px;border-radius:12px;background:#fff;margin:9px 0;font-size:clamp(14px,1.1vw,16px);font-weight:700;color:#13365b;line-height:1.5;cursor:pointer;min-height:48px;white-space:normal;overflow-wrap:anywhere}
.choice:has(input:checked){background:#e9f5ff;border-color:#075eab}.choice input{flex:none;width:18px;height:18px;accent-color:#0069bd;margin:0}
.answer{width:100%;border:2px solid #b5dbf7;border-radius:12px;padding:12px 14px;font-size:18px;background:#fff}
.small{font-size:14px;line-height:1.55;color:#33587a;font-weight:600;margin:8px 0 12px}
.paper{padding:13px 14px;margin:0;background:#fff;border:1.5px solid #c2dff3;border-radius:12px;min-width:0}
.paper h2,.stimulus-body h2{font-size:clamp(17px,1.3vw,21px);font-weight:800;color:#07538d;line-height:1.4;margin:0 0 10px}
.stimulus-body h1{font-size:clamp(20px,1.6vw,25px);font-weight:800;color:#07538d;line-height:1.3;margin:0 0 6px}
.stimulus-body>.eyebrow{display:none}
.data-table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.08vw,16px);background:#fff}
.data-table td,.data-table th{padding:9px 10px;border-bottom:1px solid #d8e9f4;text-align:left}.data-table th{background:#dff1ff;color:#0b4d80;font-weight:800}.data-table td:last-child{text-align:right;font-weight:800}
.job-label-with-image img{width:24px;height:30px}.worker-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.worker-strip figure{margin:0;text-align:center}.worker-strip img{width:100%;max-height:clamp(85px,20vh,160px);object-fit:contain}.worker-strip figcaption{font-size:11px;font-weight:700;color:#155180}
.scaled-bars{width:100%}.scaled-row{display:grid;grid-template-columns:118px minmax(0,1fr) 25px;align-items:center;gap:7px;margin:10px 0;font-size:13px}.scaled-name{display:flex;align-items:center;gap:6px;white-space:nowrap}.scaled-name img{height:29px;width:23px;object-fit:contain}.scaled-track{height:27px;background:repeating-linear-gradient(to right,#f1f8ff 0,#f1f8ff calc(20% - 1px),#b9d6e8 calc(20% - 1px),#b9d6e8 20%)}.scaled-fill{background:#087eb4;height:100%}.scaled-axis{display:flex;justify-content:space-between;margin:0 30px 0 125px;color:#235779;font-size:11px}
.picto-row{display:grid;grid-template-columns:122px minmax(0,1fr);align-items:center;gap:8px;margin:9px 0}.picto-job{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:12px}.picto-job img{width:23px;height:26px;object-fit:contain}.picto-dots{display:flex;flex-wrap:wrap;gap:6px}.symbol-full,.symbol-half{height:21px;width:21px;display:inline-block;border-radius:50%;border:1.5px solid #587f88}.symbol-full{background:var(--symbol-color,#087eb4)}.symbol-half{background:linear-gradient(to right,var(--symbol-color,#087eb4) 0 50%,#fff 50% 100%)}
.sort-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border:2px solid #b6dafa;background:#f7fbff;border-radius:12px;margin:8px 0;min-height:56px;font-size:clamp(13px,1.1vw,16px)}
.sort-row strong{min-width:0;overflow-wrap:anywhere}.sort-row span{display:flex;align-items:center;gap:6px;flex:none}
.sort-row button{border:1px solid #0757a0;border-radius:10px;background:#006ce3;color:#fff;padding:9px 11px;min-width:76px;font-size:12px;font-weight:800}.sort-row button:last-child{background:#e85c06;border-color:#bc4704}.sort-row button:disabled{opacity:.34;cursor:not-allowed}
.interactive-chart{max-width:100%;margin-top:10px}.interactive-chart svg{display:block;width:100%;max-width:620px;height:auto;overflow:visible}.interactive-chart .axis-heading{font-size:15px;font-weight:800;fill:#0b4d80}.interactive-chart .axis-tick{font-size:14px;font-weight:700;fill:#274f6e}.interactive-chart .bar-value{font-size:18px;font-weight:800;fill:#123a5e}.interactive-chart .job-label{font-size:12px;font-weight:700;fill:#184a6f}.bar-hit{cursor:pointer}.bar-hit:hover,.bar-hit:focus{stroke:#cf8500;stroke-width:2;fill:#efc44e;fill-opacity:.3}
.bar-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.bar-actions .small{margin:4px 0}.reset-bar{padding:8px 10px;background:#e6f3ff;color:#07538d;border:1px solid #b3d6ee;border-radius:8px;font-size:12px;font-weight:800}
.candidate-list{display:grid;grid-template-columns:1fr;gap:9px;margin-top:8px}.candidate{display:grid;grid-template-columns:70px minmax(0,1fr);align-items:center;gap:4px;border:1.5px solid #c9dff1;background:#fff;border-radius:10px;padding:5px 8px}.candidate strong{font-size:14px;color:#07538d}.candidate svg{display:block;width:100%;height:auto;max-height:115px}.candidate svg .job-label{font-size:11px;fill:#214d6e}
.footer{flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 11px;border-top:2px solid #c6e2f6;background:#fff}
.steptext{font-size:14px;color:#07518c;font-weight:800}.actions{display:flex;gap:9px}.btn{padding:9px 15px;min-height:39px;font-size:15px;font-weight:800;background:#075fac;color:#fff;border:1.5px solid #075fac;border-radius:10px}.btn.secondary{background:#e9f5ff;color:#07518c;border-color:#b9daf5}.btn:disabled{opacity:.36;cursor:not-allowed}
.intro{display:flex;flex-direction:column;gap:10px;width:100%;height:100%;min-height:0}.intro-label{background:#ffedb0;color:#80520d;font-size:12px;font-weight:800;border-radius:15px;padding:4px 11px}.intro-title{font-size:clamp(18px,1.5vw,22px);color:#07538d;font-weight:800;margin:0}.intro-meta{font-size:15px;color:#5a7794;margin:0}.intro-grid{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,60fr) minmax(0,40fr);gap:12px}.intro-panel{min-height:0;overflow:auto;border:1.5px solid #b9dcf5;border-radius:13px;padding:12px;background:#f0f8ff}.intro-panel.right{display:flex;align-items:center;background:#eaf6ff;padding:19px}.intro-panel.right p{font-size:clamp(15px,1.28vw,19px);font-weight:700;line-height:1.65;margin:0 0 11px}.intro-panel.right h2{font-size:clamp(18px,1.42vw,22px);font-weight:800;color:#07538d;margin:0 0 11px}.intro-panel .worker-strip img{max-height:clamp(150px,34vh,280px)}
.finish{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.finish h2{font-size:clamp(34px,4vw,52px);color:#075b9e;margin:12px 0;font-weight:800}.finish p{font-size:17px;font-weight:700;margin:0 auto;max-width:650px}
@media(max-width:760px){.shell{height:100dvh;width:100%;margin:0;border-radius:0;min-height:420px}.head{border-radius:0}.screen{overflow:auto;padding:8px}.grid,.intro-grid{grid-template-columns:1fr;height:auto}.panel{min-height:250px}.intro{height:auto}.intro-panel{min-height:210px}.footer{border-radius:0}.candidate-list{grid-template-columns:1fr}.sort-row button{min-width:68px;padding:8px 9px}}

const table=(arr=jobs)=>`<table class="data-table"><thead><tr><th>Pekerjaan</th><th>Bilangan orang</th></tr></thead><tbody>${arr.map(j=>`<tr><td><span class="job-label-with-image"><img src="data:image/webp;base64,${JOB_ART[j.name]}" alt=""><span>${E(j.name)}</span></span></td><td>${j.n}</td></tr>`).join('')}</tbody></table>`;
const bars=(arr=jobs)=>`<div class="scaled-bars" role="img" aria-label="Carta palang mendatar berskala 0 hingga 10 orang"><div class="scale-title">Bilangan orang</div>${arr.map(j=>`<div class="scaled-row"><span class="scaled-name"><img src="data:image/webp;base64,${JOB_ART[j.name]}" alt="">${E(j.name)}</span><div class="scaled-track"><div class="scaled-fill" style="width:${j.n*10}%"></div></div><strong>${j.n}</strong></div>`).join('')}<div class="scaled-axis"><span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span></div></div>`;
const pie=()=>{let total=0;let stops=[];jobs.forEach(j=>{let a=total/30*100;total+=j.n;stops.push(`${j.color} ${a}% ${total/30*100}%`)});return `<div class="chartbox"><div class="pie" role="img" aria-label="Carta pai pekerjaan ibu bapa, jumlah 30 orang" style="background:conic-gradient(${stops.join(',')})"></div><div class="legend">${jobs.map(j=>`<div class="legend-line"><span class="swatch" style="background:${j.color}"></span>${E(j.name)}: <strong>${j.n}</strong></div>`).join('')}</div></div>`};
const pictograph=()=>`<p class="small"><strong>Petunjuk:</strong> <span class="symbol-full" aria-hidden="true"></span> = 2 orang &nbsp; <span class="symbol-half" aria-hidden="true"></span> = 1 orang</p><div class="picto" role="img" aria-label="Piktograf pekerjaan. Satu bulatan penuh mewakili dua orang dan separuh bulatan mewakili seorang.">${jobs.map(j=>`<div class="picto-row"><span class="picto-job"><img src="data:image/webp;base64,${JOB_ART[j.name]}" alt="">${E(j.name)}</span><span class="picto-dots" aria-label="${j.n} orang">${Array.from({length:Math.floor(j.n/2)},()=>`<i class="symbol-full" style="--symbol-color:${j.color}"></i>`).join('')}${j.n%2?`<i class="symbol-half" style="--symbol-color:${j.color}"></i>`:''}</span></div>`).join('')}</div>`;
function chartCandidate(title,values){
 const names=['Guru','Jururawat','Peniaga'];
 const x0=105, width=258, rowYs=[32,64,96];
 return `<div class="candidate"><strong>${title}</strong><svg viewBox="0 0 390 144" role="img" aria-label="${title}, carta palang dengan paksi bilangan orang 0 hingga 10">
 <text x="105" y="11" class="axis-heading">Bilangan orang</text>
 ${Array.from({length:6},(_,i)=>{const n=i*2,x=x0+n*width/10;return `<line x1="${x}" y1="18" x2="${x}" y2="112" stroke="${i===0?'#6b9198':'#d9e6e8'}" stroke-width="${i===0?1.5:1}"/><text x="${x}" y="130" class="axis-tick" text-anchor="middle">${n}</text>`}).join('')}
 ${values.map((v,i)=>`<image href="data:image/webp;base64,${JOB_ART[names[i]]}" x="5" y="${rowYs[i]-5}" width="26" height="26" preserveAspectRatio="xMidYMid meet"/><text x="96" y="${rowYs[i]+12}" text-anchor="end" class="job-label">${names[i]}</text><rect x="${x0}" y="${rowYs[i]}" width="${v*width/10}" height="18" rx="2" fill="#248d8d"/>`).join('')}
 </svg></div>`;
}
function editableBar(){const val=answers.t5===undefined?0:Math.min(10,Math.max(0,Number(answers.t5)||0));const rows=[{name:'Guru',n:9},{name:'Jururawat',n:val,editable:true},{name:'Jurutera',n:5},{name:'Peniaga',n:7},{name:'Petani',n:3}];const base=222,step=84,unit=18,barWidth=46,startX=82,iconY=241,labelY=286;return `<div class="interactive-chart"><p class="small"><strong>Skala:</strong> 1 petak = 1 orang. Pilih petak pada palang Jururawat.</p><svg viewBox="0 0 540 312" role="group" aria-label="Carta palang interaktif, palang Jururawat perlu dilengkapkan"><text x="16" y="18" class="axis-heading">Bilangan orang</text>${Array.from({length:11},(_,i)=>{let y=base-i*unit;return `<line x1="58" y1="${y}" x2="510" y2="${y}" stroke="${i===0?'#527b80':'#cddfe1'}" stroke-width="${i===0?1.7:.8}"/><text x="46" y="${y+5}" class="axis-tick" text-anchor="end">${i}</text>`}).join('')}${rows.map((r,i)=>{const x=startX+i*step, cx=x+barWidth/2;return `<rect x="${x}" y="${base-r.n*unit}" width="${barWidth}" height="${r.n*unit}" rx="2" fill="${r.editable?'#e2a746':'#248d8d'}"/>${r.editable?Array.from({length:10},(_,j)=>{const level=j+1,y=base-level*unit;return `<rect class="bar-hit" data-height="${level}" tabindex="0" role="button" aria-label="Tetapkan palang Jururawat kepada ${level} orang" x="${x}" y="${y}" width="${barWidth}" height="${unit}" fill="transparent" stroke="#86a5aa" stroke-width=".55"/>`}).join(''):`<text x="${cx}" y="${base-r.n*unit-8}" class="bar-value" text-anchor="middle">${r.n}</text>`}<image href="data:image/webp;base64,${JOB_ART[r.name]}" x="${cx-12}" y="${iconY}" width="24" height="25" preserveAspectRatio="xMidYMid meet"/><text x="${cx}" y="${labelY}" class="job-label" text-anchor="middle">${r.name}</text>`}).join('')}<text x="284" y="306" class="axis-heading" text-anchor="middle">Pekerjaan</text></svg><div class="bar-actions"><p class="small" id="bar-status" aria-live="polite">${answers.t5===undefined?'Palang Jururawat belum dilengkapkan.':'Ketinggian palang Jururawat: '+val+' orang.'}</p><button type="button" class="reset-bar" id="clear-bar">Padam palang</button></div></div>`}
function workerStrip(){return `<div class="worker-strip" role="group" aria-label="Ilustrasi lima pekerjaan dalam tinjauan">${jobs.map(j=>`<figure><img src="data:image/webp;base64,${JOB_ART[j.name]}" alt=""><figcaption>${E(j.name)}</figcaption></figure>`).join('')}</div>`}
function stimulus(){switch(page){case 0:return `<div class="eyebrow">Misi baharu</div><h1>Menyiapkan Pameran Data</h1><div class="paper"><h2>Rekod pekerjaan ibu bapa</h2>${workerStrip()}</div>`;
case 1:return `<div class="eyebrow">Rekod kelas</div><h2>Rekod tinjauan pekerjaan</h2><div class="paper">${table()}</div>`;
case 2:return `<div class="eyebrow">Carta palang</div><h2>Bilangan mengikut pekerjaan</h2><div class="paper">${bars()}</div>`;
case 3:return `<div class="eyebrow">Piktograf pameran</div><h2>Data pekerjaan</h2><div class="paper">${pictograph()}</div>`;
case 4:return `<div class="eyebrow">Kad pameran</div><h2>Empat kategori pekerjaan</h2><div class="paper">${table([jobs[0],jobs[1],jobs[3],jobs[4]])}</div>`;
case 5:return `<div class="eyebrow">Carta palang belum lengkap</div><h2>Carta palang pameran</h2><div class="paper">${table([{name:'Jururawat',n:6}])}${editableBar()}</div>`;
case 6:return `<div class="eyebrow">Semakan akhir pameran</div><h2>Padankan jadual dengan carta</h2><div class="paper">${table([jobs[0],jobs[1],jobs[3]])}</div><div class="candidate-list">${chartCandidate('Carta A',[9,7,6])}${chartCandidate('Carta B',[9,6,7])}${chartCandidate('Carta C',[6,9,7])}</div>`;
default:return `<div class="eyebrow">Misi selesai</div><h1>Semakan pameran selesai!</h1><div class="paper"><h2>Data pekerjaan telah disemak</h2>${workerStrip()}</div>`}}
function response(t){if(t.kind==='choice')return `<fieldset style="border:0;padding:0;margin:0"><legend class="visually-hidden">Pilihan jawapan</legend>${t.choices.map((c,i)=>`<label class="choice"><input type="radio" name="choice" value="${E(c)}" ${answers[t.id]===c?'checked':''}>${E(c)}</label>`).join('')}</fieldset>`;if(t.kind==='bar')return `<p class="small">Klik petak pada carta di sebelah kiri untuk membina palang.</p>`;if(t.kind==='number')return `<label for="numeric" class="small">Jawapan (orang)</label><input id="numeric" class="answer" type="number" min="0" max="30" step="1" inputmode="numeric" placeholder="Masukkan nombor" value="${E(answers[t.id]??'')}">`;if(t.kind==='order'){let order=Array.isArray(answers[t.id])?answers[t.id]:t.initial;return `<div class="small">Gunakan anak panah untuk menyusun kad.</div><div id="sort">${order.map((n,i)=>`<div class="sort-row"><strong>${i+1}. ${E(n)}</strong><span><button data-move="-1" data-at="${i}" ${i===0?'disabled':''} aria-label="Naikkan ${E(n)}">▲ NAIK</button> <button data-move="1" data-at="${i}" ${i===order.length-1?'disabled':''} aria-label="Turunkan ${E(n)}">▼ TURUN</button></span></div>`).join('')}</div>`}return ''}
function render(){
  const app=document.getElementById('app'), footer=document.getElementById('footer');
  const t=tasks[page-1], total=tasks.length;
  if(page===0){
    app.innerHTML=`<section class="intro"><span class="intro-label">Pengenalan</span><h2 class="intro-title">Misi Menyiapkan Pameran Data</h2><p class="intro-meta">Matematik · Tahun 3</p><div class="intro-grid"><div class="intro-panel"><div class="stimulus-body">${stimulus()}</div></div><div class="intro-panel right"><div><h2>Bantu Aina menyiapkan pameran kelas</h2><p>Kelas Aina mempunyai rekod tinjauan pekerjaan bagi 30 orang dewasa.</p><p>Gunakan jadual dan carta untuk membantu Aina menyiapkan pameran.</p></div></div></div></section>`;
    footer.innerHTML=`<span class="steptext">Pengenalan</span><div class="actions"><button class="btn secondary" disabled>Kembali</button><button id="next" class="btn">Seterusnya</button></div>`;
  }else if(page===total+1){
    app.innerHTML=`<section class="finish"><div><span class="intro-label">Misi Selesai!</span><h2>Syabas! 🌟</h2><p>Terima kasih kerana membantu Aina menyemak data untuk pameran kelas.</p></div></section>`;
    footer.innerHTML=`<span class="steptext">Misi Selesai</span><div class="actions"><button class="btn secondary" id="home">Halaman Utama</button><button class="btn" id="again">Cuba Semula</button></div>`;
  }else{
    const question=`<span class="pill">Tugasan ${page} daripada ${total}</span><h2 class="question-title">${E(t.title)}</h2><p class="prompt">${E(t.question)}</p>${response(t)}`;
    app.innerHTML=`<div class="grid"><section class="panel stimulus"><h2 class="panel-heading">🖼️ Bahan Rangsangan</h2><div class="panel-scroll"><div class="stimulus-body">${stimulus()}</div></div></section><section class="panel question"><div class="panel-scroll">${question}</div></section></div>`;
    footer.innerHTML=`<span class="steptext">Langkah ${page} daripada ${total}</span><div class="actions"><button class="btn secondary" id="back">Kembali</button><button id="next" class="btn">Seterusnya</button></div>`;
  }
  const goto=n=>{page=Math.min(total+1,Math.max(0,n));render()};
  document.getElementById('back')?.addEventListener('click',()=>goto(page-1));
  document.getElementById('next')?.addEventListener('click',()=>goto(page+1));
  document.getElementById('home')?.addEventListener('click',()=>{goto(0);try{parent.postMessage({source:'JPN_MODULE_V2',kind:'home',code:'MAT005'},'*')}catch(e){}});
  document.getElementById('again')?.addEventListener('click',()=>{answers={};try{localStorage.removeItem(KEY)}catch(e){}goto(0)});
  if(t){
    if(t.kind==='choice')app.querySelectorAll('input[name="choice"]').forEach(x=>x.addEventListener('change',()=>save(t.id,x.value)));
    if(t.kind==='number')app.querySelector('#numeric')?.addEventListener('input',e=>save(t.id,e.target.value));
    if(t.kind==='bar'){
      app.querySelectorAll('[data-height]').forEach(b=>{const pick=()=>{save(t.id,b.dataset.height);render()};b.addEventListener('click',pick);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}})});
      app.querySelector('#clear-bar')?.addEventListener('click',()=>{delete answers[t.id];try{localStorage.setItem(KEY,JSON.stringify(answers))}catch(e){}render()});
    }
    if(t.kind==='order')app.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{const a=Number(b.dataset.at),z=a+Number(b.dataset.move),order=Array.isArray(answers[t.id])?[...answers[t.id]]:[...t.initial];if(z<0||z>=order.length)return;[order[a],order[z]]=[order[z],order[a]];save(t.id,order);render()}));
  }
  try{parent.postMessage({source:'JPN_MODULE_V2',kind:'state',code:'MAT005',step:page,steps:total,complete:page===total+1,answers:{...answers}},'*')}catch(e){}
}
function save(k,v){answers[k]=v;try{localStorage.setItem(KEY,JSON.stringify(answers))}catch(e){}}

/* JPN V2 MATHEMATICS: additive required-answer guard + safe export. */
const __matCode='MAT005';
const __matTouched=new Set();
const __matAnswered=x=>{
  if(x===null||x===undefined)return false;
  if(typeof x==='string')return x.trim()!=='';
  if(typeof x==='number')return Number.isFinite(x);
  if(typeof x==='boolean')return true;
  if(Array.isArray(x))return x.length>0&&x.every(__matAnswered);
  if(typeof x==='object')return Object.keys(x).length>0&&Object.values(x).every(__matAnswered);
  return false;
};
const __matStep=()=>page;
const __matTotal=()=>tasks.length;
const __matGet=(i)=>answers[tasks[i-1]?.id];
const __matCurrent=()=>{
  const p=__matStep();if(p<1||p>__matTotal())return true;
  const value=__matGet(p);
  // Select fields on the active screen; each distinct response must be filled.
  const root=document.getElementById('screen')||document.getElementById('app')||document.getElementById('response')||document;
  const groups=[...root.querySelectorAll('.choices[data-key]')];
  if(groups.length&&groups.some(el=>!__matAnswered((answers)[el.dataset.key])))return false;
  const typed=[...root.querySelectorAll('input[data-key],textarea[data-key]')];
  if(typed.length&&typed.some(el=>!String(el.value??'').trim()))return false;
  if(tasks[p-1]?.kind==='order'&&!__matTouched.has(p))return false;
  if(tasks[p-1]?.kind==='chart-dnd'){
    const expected=tasks[p-1]?.answer;
    if(!value||typeof value!=='object'||!expected||typeof expected!=='object')return false;
    return Object.keys(expected).every(k=>__matAnswered(value[k]));
  }
  return __matAnswered(value);
};
window.JPN_V2_ALL_COMPLETE=()=>Array.from({length:__matTotal()},(_,i)=>i+1).every(i=>{
 const v=__matGet(i); const t=tasks[i-1]?.kind;
 if(t==='order'&&!__matTouched.has(i))return false;
 if(t==='chart-dnd'){
   const e=tasks[i-1]?.answer;
   return Boolean(e&&v&&Object.keys(e).every(k=>__matAnswered(v[k])));
 }
 return __matAnswered(v);
});
window.JPN_V2_EXPORT=()=>({
 unitId:__matCode,version:'mat-v2-required',page:__matStep()>__matTotal()?5:(__matStep()===0?0:1),
 answers:Object.fromEntries(Array.from({length:__matTotal()},(_,i)=>[('Q'+(i+1)+'.'+__matCode),__matGet(i+1)??null]))
});
const __matAlert=()=>{
 let a=document.getElementById('__mat_wajib_jawab_alert');
 if(!a){a=document.createElement('div');a.id='__mat_wajib_jawab_alert';a.setAttribute('role','alert');
 a.style.cssText='position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:999999;padding:13px 18px;background:#fff0c4;color:#643b00;border:2px solid #e7a62d;border-radius:12px;box-shadow:0 5px 18px #0002;font:700 15px Poppins,Arial,sans-serif;max-width:92vw;text-align:center';document.body.appendChild(a)}
 a.textContent='Sila lengkapkan semua jawapan pada langkah ini sebelum meneruskan. Jawapan tidak semestinya betul.';
 setTimeout(()=>{if(a.isConnected)a.remove()},4500);
};
// Capture BEFORE existing button click handlers. No original handler/feature is removed.
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.matches('[data-move]')&&!b.disabled)__matTouched.add(__matStep());
 if(!b.matches('#next,#goNext'))return;
 if(__matStep()===0||__matStep()>__matTotal())return;
 if(!__matCurrent()||(__matStep()===__matTotal()&&!window.JPN_V2_ALL_COMPLETE())){
   e.preventDefault();e.stopImmediatePropagation();__matAlert();
 }
},true);

render();
</script>
<script>
/* JPN PAHANG V2 - postMessage bridge compatible with current Apps Script Index.html. */
(function(){'use strict';
 const CODE='MAT005';let origin='',nonce='',last=null;
 function get(){try{return window.JPN_V2_EXPORT?.()||null}catch(e){return null}}
 function notify(force){if(!origin||!nonce)return;const v=get();if(!v)return;
  if(force||v.page!==last){last=v.page;parent.postMessage({type:'psi-page',page:v.page},origin)}}
 function collect(){if(!origin||!nonce||!window.JPN_V2_ALL_COMPLETE?.())return;
  const v=get();if(!v||v.page!==5)return;
  parent.postMessage({type:'JPN_V2_COMPLETE',moduleId:CODE,nonce,response:v},origin)}
 window.addEventListener('message',e=>{
  if(e.source!==parent||!e.data||typeof e.data!=='object')return;
  const d=e.data;
  if(d.type==='JPN_V2_INIT'&&d.moduleId===CODE&&typeof d.nonce==='string'&&d.nonce.length>=8){origin=e.origin;nonce=d.nonce;last=null;notify(true)}
  else if(d.type==='JPN_V2_COLLECT'&&e.origin===origin&&d.nonce===nonce)collect();
 });
 new MutationObserver(()=>notify(false)).observe(document.body,{childList:true,subtree:true});
})();
</script>
</body></html>
