const moduleData={"schemaVersion":"psi-v1","title":"Hari SEGAK: Misi Merancang Ruang dan Data","subject":"Matematik","grade":"Tahun 4","cohort":"Tahun 3 (2026) → Tahun 4 (2027)","timssDomain":"Measurement and Geometry","dskpDoc":"R4M — Matematik Tahun 4","dskpTopic":"Ruang","dskpCode":"","dskpStandards":["6.5"],"dskpBasis":"Standard Kandungan 6.5 ialah Penyelesaian masalah, dengan Standard Pembelajaran 6.5.1 Menyelesaikan masalah melibatkan ruang. DSKP turut mencadangkan penggunaan pelbagai strategi seperti gambar rajah, model dan objek sebenar. Kandungan yang digunakan sebagai sasaran utama ialah penyelesaian masalah ruang; kemahiran seperti nombor, operasi, data, ukuran, perimeter, luas dan isi padu digunakan sebagai prasyarat atau sokongan mengikut konstruk item, bukan menggantikan Standard Kandungan 6.5.","sdgTarget":"SDG 3 — Good Health and Well-being; khususnya sokongan terhadap amalan hidup aktif dan kesejahteraan.","theme":"","issue":"Sekolah perlu mengurus ruang aktiviti, peralatan, masa dan maklumat kecergasan dengan teratur supaya Hari SEGAK dapat dijalankan secara selamat dan berkesan.","sourceName":"Kementerian Pendidikan Malaysia, Panduan Standard Kecergasan Fizikal Kebangsaan Untuk Murid Sekolah Malaysia (SEGAK); IEA/TIMSS & PIRLS International Study Center, TIMSS 2027 Assessment Frameworks","sourceUrl":"https://www.moe.gov.my/storage/files/shares/pentaksiran-berasaskan-sekolah/Panduan%20Standard%20Kecergasan%20Fizikal%20Kebangsaan%20Untuk%20Murid%20Sekolah%20Malaysia%20(SEGAK).pdf","sourceDate":"","evidence":"[object Object]","adaptation":"Konteks SEGAK diambil daripada sumber KPM, tetapi nombor, ukuran ruang, masa, bilangan murid dan keputusan yang digunakan dalam tugasan dibina semula sebagai data latihan. Kandungan Matematik dikekalkan pada aras yang munasabah untuk Tahun 4 dan setiap item berdiri sendiri. Domain kandungan TIMSS dipilih mengikut konstruk item, bukan disalin secara automatik daripada domain utama unit.","intro":"Sebuah sekolah merancang Hari SEGAK untuk murid Tahun 4. Guru perlu memastikan ruang aktiviti mencukupi, peralatan tersusun, masa diurus dengan baik dan maklumat murid dibaca dengan betul. Semua ukuran, bilangan, masa dan data skor dalam tugasan ini ialah data rekaan latihan. Setiap tugasan boleh dijawab secara bebas.","ending":"Gunakan maklumat yang diberi dalam setiap tugasan untuk membuat pengiraan, memilih strategi dan memberikan alasan yang sesuai. Tiada jawapan item terdahulu diperlukan untuk menjawab item berikutnya.","formatReport":[{"type":"single","reason":"Digunakan kerana terdapat tugasan pilihan tunggal yang mempunyai satu jawapan matematik yang jelas."},{"type":"multi","reason":"Digunakan kerana pemilihan ruang memerlukan dua syarat dipenuhi serentak dan lebih daripada satu pilihan benar."},{"type":"number","reason":"Digunakan untuk respons berangka yang mempunyai jawapan tunggal dan boleh dinilai secara objektif."},{"type":"text","reason":"Digunakan kerana konstruk memerlukan murid menerangkan alasan matematik, bukan hanya memberikan nombor."},{"type":"order","reason":"Digunakan kerana urutan tindakan mempunyai hubungan temporal yang boleh ditentukan secara bebas."},{"type":"match","reason":"Digunakan kerana empat situasi memerlukan empat jawapan kanan yang unik dan setiap padanan boleh dinilai secara bebas."}],"image":"","items":[{"id":"35be349c-24f0-4515-ab48-025ed42b4822","title":"Stesen Jangkauan Melunjur","context":"Sebuah kawasan segi empat tepat berukuran 8 m panjang dan 6 m lebar digunakan untuk satu stesen aktiviti. Guru mahu memasang pita keselamatan mengelilingi seluruh kawasan itu.","prompt":"Berapakah panjang pita keselamatan yang diperlukan untuk mengelilingi kawasan tersebut?","content":"Measurement and Geometry","cognitive":"Applying","practice":"","type":"single","options":["A. 14 m","B. 28 m","C. 48 m","D. 56 m"],"answer":"B. 28 m","help":"Jumlahkan panjang semua sisi kawasan.","difficulty":"Rendah","difficultyReason":"Murid mengenal pasti perimeter segi empat tepat dan menggunakan operasi tambah atau rumus secara terus dalam konteks yang biasa.","difficultyBasis":"Anggaran semakan kandungan; belum diuji dengan murid. Prasyarat ialah operasi asas dan konsep ukuran; konstruk utama ialah penyelesaian masalah ruang.","mathTaskDemand":"Procedures with connections","mathDemandReason":"Murid menggunakan prosedur perimeter tetapi perlu menghubungkannya dengan representasi ruang sebenar, iaitu kawasan aktiviti yang perlu dikelilingi.","image":"","reviewed":true},{"id":"3c3676e4-5a3d-4eae-8c03-6defc86a2d85","title":"Memilih Susunan Ruang","context":"Empat kawasan berikut dicadangkan untuk Hari SEGAK. Kawasan yang dipilih mestilah mempunyai luas sekurang-kurangnya 48 m² dan perimeter tidak melebihi 30 m.","prompt":"Pilih SEMUA kawasan yang memenuhi kedua-dua syarat.","content":"Measurement and Geometry","cognitive":"Reasoning","practice":"","type":"multi","options":["A. 6 m × 8 m","B. 5 m × 10 m","C. 4 m × 12 m","D. 7 m × 7 m"],"answer":"A, B, D","help":"Semak dua perkara bagi setiap kawasan: luas sekurang-kurangnya 48 m² dan perimeter tidak melebihi 30 m.","difficulty":"Sederhana","difficultyReason":"Murid perlu menguji dua syarat serentak bagi beberapa bentuk, bukan sekadar melakukan satu pengiraan.","difficultyBasis":"Anggaran semakan kandungan; belum diuji dengan murid. Memerlukan operasi asas, luas dan perimeter serta tafsiran dua kekangan dalam situasi ruang.","mathTaskDemand":"Procedures with connections","mathDemandReason":"Murid menggunakan prosedur luas dan perimeter serta menghubungkan kedua-duanya untuk membuat keputusan tentang kesesuaian ruang.","image":"","reviewed":true},{"id":"342343b6-f75c-4008-9fd0-fba426df33a1","title":"Kotak Peralatan","context":"Guru menyimpan peralatan Hari SEGAK dalam sebuah kotak berbentuk kuboid. Panjang kotak ialah 40 cm, lebarnya 25 cm dan tingginya 20 cm.","prompt":"Berapakah isi padu kotak itu dalam sentimeter padu?","content":"Measurement and Geometry","cognitive":"Knowing","practice":"","type":"number","options":["Jawapan dalam cm³"],"answer":"20000","help":"Gunakan panjang × lebar × tinggi.","difficulty":"Rendah","difficultyReason":"Ukuran diberi secara langsung dan hanya satu prosedur pengiraan isi padu diperlukan.","difficultyBasis":"Anggaran semakan kandungan; belum diuji dengan murid. Prasyarat ialah operasi darab dan pengetahuan formula isi padu kuboid.","mathTaskDemand":"Procedures without connections","mathDemandReason":"Murid menggunakan algoritma isi padu kuboid secara langsung tanpa perlu menghubungkan beberapa perwakilan atau strategi.","image":"","reviewed":true},{"id":"f3d19de9-e817-4e91-b9e9-ae3c422a2509","title":"Mengapa Ruang Ini Sesuai?","context":"Dua ruang dicadangkan untuk aktiviti pemanasan badan. Ruang A berukuran 10 m × 6 m. Ruang B berukuran 8 m × 8 m. Guru memilih ruang yang mempunyai luas lebih besar.","prompt":"Terangkan ruang yang patut dipilih dan berikan alasan berdasarkan pengiraan matematik.","content":"Measurement and Geometry","cognitive":"Reasoning","practice":"","type":"text","options":["Ruang A: 10 m × 6 m","Ruang B: 8 m × 8 m"],"answer":"Contoh jawapan: Ruang B patut dipilih kerana luas Ruang A ialah 60 m², manakala luas Ruang B ialah 64 m². Oleh itu, Ruang B mempunyai luas 4 m² lebih besar. Kriteria: menyatakan Ruang B, mengira kedua-dua luas dengan betul dan memberikan perbandingan yang menyokong keputusan.","help":"Cari luas kedua-dua ruang sebelum membuat perbandingan.","difficulty":"Sederhana","difficultyReason":"Murid perlu membuat dua pengiraan, membandingkan hasil dan menyampaikan alasan dalam ayat yang jelas.","difficultyBasis":"Anggaran semakan kandungan; belum diuji dengan murid. Prasyarat ialah formula luas segi empat tepat, operasi darab dan perbandingan nombor.","mathTaskDemand":"Procedures with connections","mathDemandReason":"Murid menghubungkan pengiraan luas dengan keputusan pemilihan ruang dan perlu menjelaskan hubungan antara bukti matematik dengan keputusan.","image":"","reviewed":true},{"id":"e940ca87-2b9b-4fb9-810d-4e7efc54d792","title":"Urutan Pengurusan Hari SEGAK","context":"Guru menyediakan beberapa tindakan untuk mengurus satu sesi Hari SEGAK. Susunan tindakan perlu mengambil kira bahawa ukuran awal perlu direkod sebelum aktiviti lain, diikuti aktiviti ujian dan penyejukan badan selepas ujian terakhir.","prompt":"Susun tindakan berikut mengikut urutan yang paling sesuai.","content":"Measurement and Geometry","cognitive":"Reasoning","practice":"","type":"order","options":["A. Merekod ukuran awal","B. Melakukan pemanasan badan","C. Menjalankan aktiviti ujian","D. Melakukan penyejukan badan"],"answer":"A, B, C, D","help":"Fikirkan perkara yang perlu direkod dahulu, perkara yang dilakukan sebelum ujian dan perkara yang dilakukan selepas ujian.","difficulty":"Sederhana","difficultyReason":"Murid perlu mentafsir hubungan masa antara beberapa tindakan dan menghasilkan urutan yang konsisten, bukan sekadar mengira.","difficultyBasis":"Anggaran semakan kandungan; belum diuji dengan murid. Prasyarat ialah kefahaman masa dan urutan peristiwa; konstruk item menggunakan data prosedural dalam konteks sebenar.","mathTaskDemand":"Doing mathematics","mathDemandReason":"Murid perlu menentukan urutan berdasarkan beberapa hubungan dan kekangan konteks, tanpa satu algoritma pengiraan yang terus diberikan.","image":"","reviewed":true},{"id":"dcd88095-41ac-472b-aa6c-6a8063149111","title":"Padankan Maklumat Stesen","context":"Empat maklumat ringkas digunakan oleh guru untuk menyediakan ruang Hari SEGAK. Padankan setiap situasi dengan tindakan atau ukuran matematik yang paling sesuai.","prompt":"Padankan setiap soalan dengan jawapan yang betul.","content":"Measurement and Geometry","cognitive":"Applying","practice":"","type":"match","options":["Berapakah ruang lantai bagi kawasan 9 m × 5 m? | 45 m²","Berapakah panjang pita untuk mengelilingi kawasan 9 m × 5 m? | 28 m","Berapakah isi padu kotak 4 cm × 3 cm × 2 cm? | 24 cm³","Sebuah kawasan mempunyai luas 36 m² dan panjang 6 m. Berapakah lebarnya? | 6 m"],"answer":"Berapakah ruang lantai bagi kawasan 9 m × 5 m? | 45 m²\nBerapakah panjang pita untuk mengelilingi kawasan 9 m × 5 m? | 28 m\nBerapakah isi padu kotak 4 cm × 3 cm × 2 cm? | 24 cm³\nSebuah kawasan mempunyai luas 36 m² dan panjang 6 m. Berapakah lebarnya? | 6 m","help":"Kenal pasti dahulu sama ada soalan memerlukan luas, perimeter, isi padu atau panjang yang belum diketahui.","difficulty":"Sederhana","difficultyReason":"Murid perlu membezakan beberapa jenis kuantiti ruang sebelum melakukan pengiraan yang sesuai.","difficultyBasis":"Anggaran semakan kandungan; belum diuji dengan murid. Memerlukan pengetahuan operasi asas serta hubungan antara luas, perimeter, isi padu dan ukuran panjang.","mathTaskDemand":"Procedures with connections","mathDemandReason":"Murid perlu mengenal pasti prosedur yang sesuai berdasarkan jenis kuantiti yang ditanya dan menghubungkan ukuran dengan situasi ruang.","image":"","reviewed":true}]};

function segakPicture(key,caption=''){
 const alt={zone:'Kawasan stesen aktiviti berpita keselamatan',tape:'Gulungan pita keselamatan',box:'Kotak peralatan berbentuk kuboid',spaces:'Pelan kawasan aktiviti segi empat tepat dan segi empat sama',record:'Murid merekod ukuran',warmup:'Murid melakukan pemanasan badan',test:'Murid melakukan ujian SEGAK',cooldown:'Murid melakukan penyejukan badan'};
 return `<figure class="segak-figure"><img src="${SEGAK_ART[key]}" alt="${alt[key]||'Ilustrasi Hari SEGAK'}"><figcaption>${escapeHtml(caption)}</figcaption></figure>`;
}
function segakGallery(ids,labels=[]){return `<div class="segak-gallery segak-gallery-${ids.length}">${ids.map((id,i)=>segakPicture(id,labels[i]||'')).join('')}</div>`}
function segakPlan(label,length,width){return `<div class="segak-plan"><b>${escapeHtml(label)}</b><div class="segak-plan-drawing"><span>${escapeHtml(String(length))} m</span><div class="segak-rect" style="--r:${length/width};--lw:${Math.min(190,length*13)}px"></div><span>${escapeHtml(String(width))} m</span></div><strong>${length} m × ${width} m</strong></div>`}
function segakPlans(step){
 if(step===1)return `<div class="segak-plot-plans">${segakPlan('Kawasan stesen',8,6)}</div>`;
 if(step===2)return `<div class="segak-plot-plans four">${[['A',6,8],['B',5,10],['C',4,12],['D',7,7]].map(x=>segakPlan('Kawasan '+x[0],x[1],x[2])).join('')}</div>`;
 if(step===3)return `<div class="segak-dimensions"><span>Panjang <b>40 cm</b></span><span>Lebar <b>25 cm</b></span><span>Tinggi <b>20 cm</b></span></div>`;
 if(step===4)return `<div class="segak-plot-plans pair">${segakPlan('Ruang A',10,6)}${segakPlan('Ruang B',8,8)}</div>`;
 return '';
}
function segakMedia(step){
 if(step===1)return segakGallery(['zone'],['Kawasan aktiviti']);
 if(step===2)return segakGallery(['spaces'],['Susunan ruang']);
 if(step===3)return segakGallery(['box'],['Kotak peralatan']);
 if(step===4)return segakGallery(['spaces'],['Perbandingan ruang']);
 if(step===5)return segakGallery(['record','warmup','test','cooldown'],['A. Merekod ukuran awal','B. Melakukan pemanasan badan','C. Menjalankan aktiviti ujian','D. Melakukan penyejukan badan']);
 return segakGallery(['zone','tape','box','spaces'],['Kawasan aktiviti','Pita keselamatan','Kotak peralatan','Pelan ruang']);
}
function stimulus(){const item=items[page-1];if(!item)return '';
 return `<h2>${escapeHtml(item.title)}</h2><div class="segak-flex-visual">${segakMedia(page)}</div>${segakPlans(page)}<div class="paper"><p class="context">${formatText(item.context)}</p></div>`;
}
function response(item){const val=answers[item.id];
 if(item.type==='single'||item.type==='multi')return `<div>${item.options.map((o,j)=>`<label class="mat-choice"><input type="${item.type==='single'?'radio':'checkbox'}" name="r" value="${j}" ${(item.type==='single'&&val===o)||(item.type==='multi'&&Array.isArray(val)&&val.includes(o))?'checked':''}><span>${escapeHtml(o)}</span></label>`).join('')}</div>`;
 if(item.type==='order'){const order=Array.isArray(val)&&val.length===item.options.length?val:(item.id==='e940ca87-2b9b-4fb9-810d-4e7efc54d792'?[item.options[2],item.options[0],item.options[3],item.options[1]]:item.options);return `<p class="small">Gunakan butang NAIK dan TURUN untuk menyusun mengikut arahan.</p><div id="sort">${order.map((o,i)=>`<div class="sort-row"><strong>${i+1}. ${escapeHtml(o)}</strong><span><button data-at="${i}" data-move="-1" ${i===0?'disabled':''}>▲ NAIK</button><button data-at="${i}" data-move="1" ${i===order.length-1?'disabled':''}>▼ TURUN</button></span></div>`).join('')}</div>`}
 if(item.type==='match'){const options=item.options.map(x=>x.split('|')[1]?.trim()||x.trim());const values=Array.isArray(val)?val:[];return `<div>${item.options.map((o,i)=>`<div class="match-row"><label for="match-${i}">${escapeHtml(o.split('|')[0].trim())}</label><select id="match-${i}" data-match="${i}"><option value="">Pilih jawapan</option>${options.map(v=>`<option value="${escapeHtml(v)}" ${values[i]===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}</select></div>`).join('')}</div>`}
 if(item.type==='number')return `<label for="numeric" class="small">Jawapan (cm³)</label><input id="numeric" class="answer" type="number" step="any" inputmode="decimal" min="0" placeholder="Masukkan nombor" value="${escapeHtml(val??'')}">`;
 return `<label for="typed" class="small">Tulis penerangan anda</label><textarea id="typed" class="mat-textarea" placeholder="Tulis jawapan dan sebab anda di sini">${escapeHtml(val??'')}</textarea>`;
}
function save(k,v){answers[k]=v;try{localStorage.setItem(KEY,JSON.stringify(answers))}catch(e){}notify()}
function capture(){const item=items[page-1];if(!item)return;const root=document.getElementById('app');
 if(item.type==='single'){const x=root.querySelector('input[name="r"]:checked');if(x)save(item.id,item.options[Number(x.value)])}
 else if(item.type==='multi')save(item.id,[...root.querySelectorAll('input[name="r"]:checked')].map(x=>item.options[Number(x.value)]));
 else if(item.type==='match')save(item.id,[...root.querySelectorAll('[data-match]')].map(x=>x.value));
 else if(item.type==='text')save(item.id,root.querySelector('#typed')?.value??'');
 else if(item.type==='number')save(item.id,root.querySelector('#numeric')?.value??'');
 else if(item.type==='order'&&!Array.isArray(answers[item.id]))save(item.id,item.id==='e940ca87-2b9b-4fb9-810d-4e7efc54d792'?[item.options[2],item.options[0],item.options[3],item.options[1]]:[...item.options]);
}

// Gunakan ruang sebenar setiap panel: isi ruang yang kosong, namun tidak potong maklumat.
function fitPanelImage(pane){
 if(!pane)return;
 const body=pane.querySelector('.stimulus-body');
 const img=pane.querySelector('.visual-art');
 if(!body)return;
 pane.classList.remove('is-fitted');
 const styles=getComputedStyle(pane);
 const inset=(parseFloat(styles.paddingTop)||0)+(parseFloat(styles.paddingBottom)||0);
 const available=pane.clientHeight-inset;
 if(available<80)return;
 if(img){
   // Kurangkan gambar terlebih dahulu untuk mengukur ruang teks dan jadual sebenar.
   img.style.height='1px'; img.style.maxHeight='none';
   const fixed=Math.max(0,body.scrollHeight-1);
   const margin=8;
   const room=Math.max(48,available-fixed-margin);
   const visualWidth=img.getBoundingClientRect().width||pane.clientWidth;
   const imageRatio=img.naturalWidth>0&&img.naturalHeight>0?img.naturalHeight/img.naturalWidth:1;
   const naturalSize=Math.max(48,visualWidth*imageRatio);
   // Isi ruang panel, setakat tinggi yang diperlukan oleh gambar pada lebar penuh.
   const target=Math.max(48,Math.min(room,naturalSize));
   img.style.height=target+'px';
   // Biar elemen membesar/membalut semula, kemudian kecilkan hanya jika tersisa limpahan.
   for(let i=0;i<3;i++){
     const excess=body.scrollHeight-available;
     if(excess<=1)break;
     const h=img.getBoundingClientRect().height;
     img.style.height=Math.max(45,h-excess-5)+'px';
   }
 }
 if(body.scrollHeight<=available+3)pane.classList.add('is-fitted');
}
function fitStimulus(){
 for(const pane of document.querySelectorAll('.stimulus .panel-scroll,.intro-panel')){
  const body=pane.querySelector('.stimulus-body');if(!body)continue;
  pane.classList.remove('is-fitted');
  if(body.scrollHeight<=pane.clientHeight+2)pane.classList.add('is-fitted');
 }
}
let resizeObserver;
function scheduleFitStimulus(){
 requestAnimationFrame(()=>{fitStimulus();requestAnimationFrame(fitStimulus)});
}
window.addEventListener('resize',scheduleFitStimulus);
function notify(){try{window.parent.postMessage({source:'JPN_MODULE_V2',kind:'state',code:'MAT010',step:page,steps:items.length,complete:page===items.length+1,answers:{...answers}},'*')}catch(e){}}
function render(){const app=document.getElementById('app'),foot=document.getElementById('footer'),item=items[page-1];
 if(page===0){app.innerHTML=`<section class="intro"><span class="intro-label">Pengenalan</span><h2 class="intro-title">${escapeHtml(moduleData.title)}</h2><p class="intro-meta">${escapeHtml(moduleData.subject)} · ${escapeHtml(moduleData.grade)}</p><div class="intro-grid"><div class="intro-panel"><div class="stimulus-body"><h2>Hari SEGAK</h2>${segakGallery(['zone','box','record'],['Ruang aktiviti','Peralatan','Merekod ukuran'])}</div></div><div class="intro-panel right"><div><h2>Misi Merancang Ruang dan Data</h2><p>${escapeHtml(moduleData.intro)}</p></div></div></div></section>`;
 foot.innerHTML=`<span class="steptext">Pengenalan</span><div class="actions"><button class="btn secondary" disabled>Kembali</button><button class="btn" id="next">Seterusnya</button></div>`;
 }else if(page===items.length+1){app.innerHTML=`<section class="finish"><div><span class="intro-label">Misi Selesai!</span><h2>Syabas! 🌟</h2><p>${escapeHtml(moduleData.ending)}</p></div></section>`;
 foot.innerHTML=`<span class="steptext">Misi Selesai</span><div class="actions"><button class="btn secondary" id="home">Halaman Utama</button><button class="btn" id="again">Cuba Semula</button></div>`;
 }else{app.innerHTML=`<div class="grid"><section class="panel stimulus" data-step="${page}"><h2 class="panel-heading">🖼️ Bahan Rangsangan</h2><div class="panel-scroll"><div class="stimulus-body">${stimulus()}</div></div></section><section class="panel question"><div class="panel-scroll"><span class="pill">Tugasan ${page} daripada ${items.length}</span><h2 class="question-title">${escapeHtml(item.title)}</h2><p class="prompt">${escapeHtml(item.prompt)}</p>${response(item)}</div></section></div>`;
 foot.innerHTML=`<span class="steptext">Langkah ${page} daripada ${items.length}</span><div class="actions"><button class="btn secondary" id="back">Kembali</button><button class="btn" id="next">Seterusnya</button></div>`;
 }
 const goto=n=>{capture();page=Math.max(0,Math.min(items.length+1,n));render()};
 document.getElementById('back')?.addEventListener('click',()=>goto(page-1));
 document.getElementById('next')?.addEventListener('click',()=>goto(page+1));
 document.getElementById('home')?.addEventListener('click',()=>{page=0;render();try{window.parent.postMessage({source:'JPN_MODULE_V2',kind:'home',code:'MAT010'},'*')}catch(e){}});
 document.getElementById('again')?.addEventListener('click',()=>{answers={};try{localStorage.removeItem(KEY)}catch(e){}page=0;render()});
 if(item){
  app.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{const a=Number(b.dataset.at),z=a+Number(b.dataset.move),arr=Array.isArray(answers[item.id])?[...answers[item.id]]:(item.id==='e940ca87-2b9b-4fb9-810d-4e7efc54d792'?[item.options[2],item.options[0],item.options[3],item.options[1]]:[...item.options]);if(z<0||z>=arr.length)return;[arr[a],arr[z]]=[arr[z],arr[a]];save(item.id,arr);render()}));
  app.querySelectorAll('input[name="r"]').forEach(el=>el.addEventListener('change',()=>{capture();if(item.type==='multi'||item.type==='single')render()}));
  app.querySelectorAll('[data-match]').forEach(el=>el.addEventListener('change',capture));
  app.querySelector('#numeric')?.addEventListener('input',capture);
  app.querySelector('#typed')?.addEventListener('input',capture);
 }
 notify();
 if(page>=0&&page<=items.length){
  app.querySelectorAll('.segak-figure img').forEach(img=>{if(!img.complete)img.addEventListener('load',scheduleFitStimulus,{once:true})});
  scheduleFitStimulus();
 }
}

/* JPN V2 MATHEMATICS: additive required-answer guard + safe export. */
const __matCode='MAT010';
const __matTouched=new Set();
const __matAnswered=x=>{
  if(x===null||x===undefined)return false;
  if(typeof x==='string')return x.trim()!=='';
  if(typeof x==='number')return Number.isFinite(x);
  if(typeof x==='boolean')return true;
  if(Array.isArray(x))return x.length>0&&x.every(__matAnswered);
  if(typeof x==='object')return Object.keys(x).length>0&&Object.values(x).every(__matAnswered);
  return false;
};
const __matStep=()=>page;
const __matTotal=()=>items.length;
const __matGet=(i)=>answers[items[i-1]?.id];
const __matCurrent=()=>{
  const p=__matStep();if(p<1||p>__matTotal())return true;
  const value=__matGet(p);
  // Select fields on the active screen; each distinct response must be filled.
  const root=document.getElementById('screen')||document.getElementById('app')||document.getElementById('response')||document;
  const groups=[...root.querySelectorAll('.choices[data-key]')];
  if(groups.length&&groups.some(el=>!__matAnswered((answers)[el.dataset.key])))return false;
  const typed=[...root.querySelectorAll('input[data-key],textarea[data-key]')];
  if(typed.length&&typed.some(el=>!String(el.value??'').trim()))return false;
  if(items[p-1]?.type==='order'&&!__matTouched.has(p))return false;
  if(items[p-1]?.type==='chart-dnd'){
    const expected=items[p-1]?.answer;
    if(!value||typeof value!=='object'||!expected||typeof expected!=='object')return false;
    return Object.keys(expected).every(k=>__matAnswered(value[k]));
  }
  return __matAnswered(value);
};
window.JPN_V2_ALL_COMPLETE=()=>Array.from({length:__matTotal()},(_,i)=>i+1).every(i=>{
 const v=__matGet(i); const t=items[i-1]?.type;
 if(t==='order'&&!__matTouched.has(i))return false;
 if(t==='chart-dnd'){
   const e=items[i-1]?.answer;
   return Boolean(e&&v&&Object.keys(e).every(k=>__matAnswered(v[k])));
 }
 return __matAnswered(v);
});
window.JPN_V2_EXPORT=()=>({
 unitId:__matCode,version:'mat-v2-required',page:__matStep()>__matTotal()?5:(__matStep()===0?0:1),
 answers:Object.fromEntries(Array.from({length:__matTotal()},(_,i)=>[('Q'+(i+1)+'.'+__matCode),__matGet(i+1)??null]))
});
const __matAlert=()=>{
 let a=document.getElementById('__mat_wajib_jawab_alert');
 if(!a){a=document.createElement('div');a.id='__mat_wajib_jawab_alert';a.setAttribute('role','alert');
 a.style.cssText='position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:999999;padding:13px 18px;background:#fff0c4;color:#643b00;border:2px solid #e7a62d;border-radius:12px;box-shadow:0 5px 18px #0002;font:700 15px Poppins,Arial,sans-serif;max-width:92vw;text-align:center';document.body.appendChild(a)}
 a.textContent='Sila lengkapkan semua jawapan pada langkah ini sebelum meneruskan. Jawapan tidak semestinya betul.';
 setTimeout(()=>{if(a.isConnected)a.remove()},4500);
};
// Capture BEFORE existing button click handlers. No original handler/feature is removed.
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.matches('[data-move]')&&!b.disabled)__matTouched.add(__matStep());
 if(!b.matches('#next,#goNext'))return;
 if(__matStep()===0||__matStep()>__matTotal())return;
 if(!__matCurrent()||(__matStep()===__matTotal()&&!window.JPN_V2_ALL_COMPLETE())){
   e.preventDefault();e.stopImmediatePropagation();__matAlert();
 }
},true);

render();
</script>
<script>
/* JPN PAHANG V2 - postMessage bridge compatible with current Apps Script Index.html. */
(function(){'use strict';
 const CODE='MAT010';let origin='',nonce='',last=null;
 function get(){try{return window.JPN_V2_EXPORT?.()||null}catch(e){return null}}
 function notify(force){if(!origin||!nonce)return;const v=get();if(!v)return;
  if(force||v.page!==last){last=v.page;parent.postMessage({type:'psi-page',page:v.page},origin)}}
 function collect(){if(!origin||!nonce||!window.JPN_V2_ALL_COMPLETE?.())return;
  const v=get();if(!v||v.page!==5)return;
  parent.postMessage({type:'JPN_V2_COMPLETE',moduleId:CODE,nonce,response:v},origin)}
 window.addEventListener('message',e=>{
  if(e.source!==parent||!e.data||typeof e.data!=='object')return;
  const d=e.data;
  if(d.type==='JPN_V2_INIT'&&d.moduleId===CODE&&typeof d.nonce==='string'&&d.nonce.length>=8){origin=e.origin;nonce=d.nonce;last=null;notify(true)}
  else if(d.type==='JPN_V2_COLLECT'&&e.origin===origin&&d.nonce===nonce)collect();
 });
 new MutationObserver(()=>notify(false)).observe(document.body,{childList:true,subtree:true});
})();
</script>
