<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAT003 – Misi Bijak Wang</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#075eaa;--deep:#064977;--line:#b5dcfa;--pale:#ecf7ff;--yellow:#fff1ad;--ink:#0d3156}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Poppins,'Segoe UI',Arial,sans-serif;background:#eaf5ff;color:var(--ink)}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffa41b;outline-offset:2px}
.shell{height:100dvh;min-height:440px;display:flex;flex-direction:column;padding:10px 13px 9px;gap:0;overflow:hidden}
.head{flex:0 0 auto;background:linear-gradient(110deg,#07548f,#0b83b7);border-radius:19px 19px 0 0;border-bottom:3px solid #f6c755;color:white;padding:8px 16px}
.head strong{display:block;font-size:clamp(18px,1.55vw,23px);font-weight:800;line-height:1.25}.head small{display:block;font-size:12px;color:#fff1bf;font-weight:700;line-height:1.4}
.screen{min-height:0;flex:1;overflow:hidden;background:white;padding:7px 9px;display:flex}
.grid{display:grid;grid-template-columns:minmax(0,60fr) minmax(0,40fr);gap:12px;width:100%;height:100%;min-height:0}
.panel{min-height:0;min-width:0;border:1.5px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;padding:9px 10px}
.stimulus{background:var(--pale)}.question{background:#fff}.panel-heading{margin:0 0 8px;flex:0 0 auto;font-size:clamp(15px,1.2vw,18px);font-weight:800;color:#075187;line-height:1.35}
.panel-scroll{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#a3cce5 transparent;flex:1; padding-right:3px}
.stage{display:flex;flex-direction:column;gap:10px}
.paper{border:1px solid #f1c43e;background:#fff1a8;border-radius:12px;padding:9px 11px; margin:0}
.paper h2{font-size:clamp(14px,1.14vw,17px);font-weight:800;color:#065187;margin:0 0 6px;line-height:1.3}.paper p{margin:0 0 6px;line-height:1.48;font-size:14px}
.table-wrap{width:100%;overflow-x:auto}.table{border-collapse:collapse;width:100%;font-size:clamp(12px,.93vw,14px);background:#fff;border-radius:8px;overflow:hidden}
.table th,.table td{border-bottom:1px solid #efcd73;padding:6px 7px;text-align:left;vertical-align:top;overflow-wrap:anywhere}.table tr:last-child th,.table tr:last-child td{border-bottom:0}.table th{font-weight:800}.table th:first-child{width:44%}
.object-visual{margin:0;padding:7px;border:1px solid #c5def2;border-radius:12px;background:#fff}.object-row{display:flex;align-items:center;justify-content:space-evenly;gap:8px}.object-item{min-width:0;flex:1;display:flex;align-items:center;flex-direction:column;justify-content:center}.object-item img{width:100%;height:clamp(115px,24vh,175px);object-fit:contain}.object-item span{text-align:center;font-weight:700;font-size:13px}.object-visual.count-1 .object-item{max-width:280px}
.pill{display:block;border-radius:20px;background:#dff0ff;color:#075288;padding:6px 12px;font-size:13px;font-weight:800;line-height:1.3;margin-bottom:12px}
.question h1{font-size:clamp(17px,1.35vw,20px);line-height:1.4;margin:0 0 12px;color:#075187;font-weight:800}.quest-title{font-size:clamp(15px,1.2vw,18px);font-weight:800;color:#075187;margin:0 0 9px;line-height:1.4}
.prompt{display:block;font-size:clamp(17px,1.45vw,21px);font-weight:800;line-height:1.4;color:#0e2c50;margin:0 0 12px}
.question .response{margin-top:10px}.response label{display:block;margin:6px 0 11px;font-weight:800;font-size:clamp(17px,1.35vw,20px);line-height:1.45}
.response input{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:18px;max-width:100%;color:#174675;background:white}
.choices{display:grid;gap:9px}.choice{border:2px solid #b4dbf7;background:#fff;border-radius:12px;display:flex;text-align:left;align-items:center;gap:11px;padding:10px;font-size:clamp(14px,1.12vw,16px);font-weight:700;line-height:1.4;color:#10345b;min-height:48px;width:100%;white-space:normal;overflow-wrap:anywhere}
.choice:before{content:'';height:18px;width:18px;border-radius:50%;border:2px solid #2d8dc6;flex-shrink:0}.choice[aria-pressed=true]{background:#e6f5ff;border-color:#0963b5}.choice[aria-pressed=true]:before{background:#0963b5;box-shadow:inset 0 0 0 4px #fff}
.intro{display:flex;flex-direction:column;width:100%;min-height:0;height:100%;gap:10px}.intro-label{background:#fff0b6;color:#805014;font-weight:800;padding:3px 12px;font-size:12px;border-radius:20px}.intro h2{color:#06528b;font-size:clamp(18px,1.45vw,22px);margin:0;font-weight:800}.intro-meta{font-size:15px;color:#5b7490;margin:0}.intro-content{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,60fr) minmax(0,40fr);gap:12px}
.intro-left,.intro-right{min-height:0;border:1.5px solid var(--line);border-radius:14px;padding:10px;overflow:auto}.intro-left{background:#f1f8ff;display:flex;flex-direction:column;gap:8px}.intro-right{background:#eaf6ff;display:flex;align-items:center;padding:19px}.intro-right-inner{font-size:clamp(16px,1.3vw,19px);font-weight:700;line-height:1.6}.intro-right-inner h1{font-size:clamp(19px,1.5vw,23px);margin:0 0 12px;color:#07528c}.intro-right-inner p{margin:0 0 10px}
.intro-left .object-item img{height:clamp(92px,19vh,150px)}
.finish{height:100%;width:100%;display:flex;align-items:center;justify-content:center;text-align:center}.finish h2{font-size:clamp(35px,4vw,52px);color:#075b9e;margin:4px 0}.finish p{font-size:18px;font-weight:600;max-width:680px;margin:0 auto}.finish .object-visual{margin:13px auto;max-width:590px}.finish .object-item img{height:110px}
.footer{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;background:white;border-top:2px solid #cce4f7;border-radius:0 0 16px 16px;padding:7px 9px;gap:8px;min-height:55px}
.steptext{font-size:14px;color:#064f82;font-weight:800}.actions{display:flex;gap:9px}.btn{background:var(--blue);color:white;border:1.5px solid var(--blue);border-radius:10px;padding:9px 16px;font-size:15px;font-weight:800;min-height:40px}.btn.secondary{background:#ecf6ff;color:#065187;border-color:#bddcf7}.btn:disabled{opacity:.43;cursor:not-allowed}
@media(max-width:760px){.shell{padding:0;min-height:100dvh}.head{border-radius:0}.screen{overflow:auto;min-height:0}.grid,.intro-content{grid-template-columns:1fr;height:auto;overflow:visible}.panel{min-height:260px;overflow:visible}.panel-scroll{overflow:visible}.intro{height:auto;min-height:100%}.intro-left,.intro-right{min-height:200px;overflow:visible}.footer{border-radius:0}.object-item img{height:135px}}
</style></head><body><main class="shell"><header class="head"><strong>Misi Bijak Wang</strong><small>Matematik · Tahun 3 · Item Interaktif</small></header><div class="screen" id="screen"></div><footer class="footer" id="footer"></footer></main>

  screen.innerHTML=`<section class="finish"><div><span class="intro-label">Misi Selesai!</span><h2>Syabas! 🌟</h2><p>Terima kasih kerana membantu Aina merancang pembelian bahan projek.</p>${visual([['card','Kad manila'],['glue','Gam'],['marker','Pen penanda']], 'Bahan projek Aina')}</div></section>`;
  footer.innerHTML=`<span class="steptext">Misi Selesai</span><div class="actions"><button type="button" class="btn secondary" id="goHome">Halaman Utama</button><button type="button" class="btn" id="goAgain">Cuba Semula</button></div>`;
 }else{
  screen.innerHTML=`<div class="grid"><section class="panel stimulus"><h2 class="panel-heading">🖼️ Bahan Rangsangan</h2><div class="panel-scroll"><div class="stage">${p.left}</div></div></section><section class="panel question"><div class="panel-scroll"><span class="pill">Tugasan ${step} daripada 6</span>${p.right}</div></section></div>`;
  footer.innerHTML=`<span class="steptext">Langkah ${step} daripada 6</span><div class="actions"><button type="button" class="btn secondary" id="goBack">Kembali</button><button type="button" class="btn" id="goNext">Seterusnya</button></div>`;
 }
 document.getElementById('goNext')?.addEventListener('click',()=>{if(step<7){step++;render()}});
 document.getElementById('goBack')?.addEventListener('click',()=>{if(step>0){step--;render()}});
 document.getElementById('goHome')?.addEventListener('click',()=>{step=0;render();try{parent.postMessage({source:'JPN_MODULE_V2',kind:'home',code:'MAT003'},'*')}catch(e){}});
 document.getElementById('goAgain')?.addEventListener('click',()=>{step=0;Object.keys(answers).forEach(k=>delete answers[k]);save();render()});
 screen.querySelectorAll('.choices').forEach(group=>{const key=group.dataset.key;group.querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed',String(answers[key]===b.dataset.val));b.addEventListener('click',()=>{answers[key]=b.dataset.val;save();group.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})})});
 screen.querySelectorAll('input[data-key]').forEach(el=>{el.value=answers[el.dataset.key]??'';el.addEventListener('input',()=>{answers[el.dataset.key]=el.value;save()})});
 try{parent.postMessage({source:'JPN_MODULE_V2',kind:'state',code:'MAT003',step,steps:6,complete:step===7,answers:{...answers}},'*')}catch(e){}
}

function __matPageValue(i){
 const h=pages[i]?.right||'';
 const keys=[...h.matchAll(/data-key=["']([^"']+)["']/g)].map(m=>m[1]);
 const uniq=[...new Set(keys)];
 if(!uniq.length)return null;
 return Object.fromEntries(uniq.map(k=>[k,answers[k]??null]));
}

/* JPN V2 MATHEMATICS: additive required-answer guard + safe export. */
const __matCode='MAT003';
const __matTouched=new Set();
const __matAnswered=x=>{
  if(x===null||x===undefined)return false;
  if(typeof x==='string')return x.trim()!=='';
  if(typeof x==='number')return Number.isFinite(x);
  if(typeof x==='boolean')return true;
  if(Array.isArray(x))return x.length>0&&x.every(__matAnswered);
  if(typeof x==='object')return Object.keys(x).length>0&&Object.values(x).every(__matAnswered);
  return false;
};
const __matStep=()=>step;
const __matTotal=()=>6;
const __matGet=(i)=>__matPageValue(i);
const __matCurrent=()=>{
  const p=__matStep();if(p<1||p>__matTotal())return true;
  const value=__matGet(p);
  // Select fields on the active screen; each distinct response must be filled.
  const root=document.getElementById('screen')||document.getElementById('app')||document.getElementById('response')||document;
  const groups=[...root.querySelectorAll('.choices[data-key]')];
  if(groups.length&&groups.some(el=>!__matAnswered((answers)[el.dataset.key])))return false;
  const typed=[...root.querySelectorAll('input[data-key],textarea[data-key]')];
  if(typed.length&&typed.some(el=>!String(el.value??'').trim()))return false;
  if(''==='order'&&!__matTouched.has(p))return false;
  if(''==='chart-dnd'){
    const expected=null?.answer;
    if(!value||typeof value!=='object'||!expected||typeof expected!=='object')return false;
    return Object.keys(expected).every(k=>__matAnswered(value[k]));
  }
  return __matAnswered(value);
};
window.JPN_V2_ALL_COMPLETE=()=>Array.from({length:__matTotal()},(_,i)=>i+1).every(i=>{
 const v=__matGet(i); const t='';
 if(t==='order'&&!__matTouched.has(i))return false;
 if(t==='chart-dnd'){
   const e=null?.answer;
   return Boolean(e&&v&&Object.keys(e).every(k=>__matAnswered(v[k])));
 }
 return __matAnswered(v);
});
window.JPN_V2_EXPORT=()=>({
 unitId:__matCode,version:'mat-v2-required',page:__matStep()>__matTotal()?5:(__matStep()===0?0:1),
 answers:Object.fromEntries(Array.from({length:__matTotal()},(_,i)=>[('Q'+(i+1)+'.'+__matCode),__matGet(i+1)??null]))
});
const __matAlert=()=>{
 let a=document.getElementById('__mat_wajib_jawab_alert');
 if(!a){a=document.createElement('div');a.id='__mat_wajib_jawab_alert';a.setAttribute('role','alert');
 a.style.cssText='position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:999999;padding:13px 18px;background:#fff0c4;color:#643b00;border:2px solid #e7a62d;border-radius:12px;box-shadow:0 5px 18px #0002;font:700 15px Poppins,Arial,sans-serif;max-width:92vw;text-align:center';document.body.appendChild(a)}
 a.textContent='Sila lengkapkan semua jawapan pada langkah ini sebelum meneruskan. Jawapan tidak semestinya betul.';
 setTimeout(()=>{if(a.isConnected)a.remove()},4500);
};
// Capture BEFORE existing button click handlers. No original handler/feature is removed.
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.matches('[data-move]')&&!b.disabled)__matTouched.add(__matStep());
 if(!b.matches('#next,#goNext'))return;
 if(__matStep()===0||__matStep()>__matTotal())return;
 if(!__matCurrent()||(__matStep()===__matTotal()&&!window.JPN_V2_ALL_COMPLETE())){
   e.preventDefault();e.stopImmediatePropagation();__matAlert();
 }
},true);

render();
</script>
<script>
/* JPN PAHANG V2 - postMessage bridge compatible with current Apps Script Index.html. */
(function(){'use strict';
 const CODE='MAT003';let origin='',nonce='',last=null;
 function get(){try{return window.JPN_V2_EXPORT?.()||null}catch(e){return null}}
 function notify(force){if(!origin||!nonce)return;const v=get();if(!v)return;
  if(force||v.page!==last){last=v.page;parent.postMessage({type:'psi-page',page:v.page},origin)}}
 function collect(){if(!origin||!nonce||!window.JPN_V2_ALL_COMPLETE?.())return;
  const v=get();if(!v||v.page!==5)return;
  parent.postMessage({type:'JPN_V2_COMPLETE',moduleId:CODE,nonce,response:v},origin)}
 window.addEventListener('message',e=>{
  if(e.source!==parent||!e.data||typeof e.data!=='object')return;
  const d=e.data;
  if(d.type==='JPN_V2_INIT'&&d.moduleId===CODE&&typeof d.nonce==='string'&&d.nonce.length>=8){origin=e.origin;nonce=d.nonce;last=null;notify(true)}
  else if(d.type==='JPN_V2_COLLECT'&&e.origin===origin&&d.nonce===nonce)collect();
 });
 new MutationObserver(()=>notify(false)).observe(document.body,{childList:true,subtree:true});
})();
</script>
