function capture(){if(page<1||page>items.length)return;let it=items[page-1],r=$('response');if(!r)return;if(it.type==='number')answers[page]=r.querySelector('input')?.value||'';else if(it.type==='multi')answers[page]=[...r.querySelectorAll('input:checked')].map(x=>x.value);else if(it.type==='singlewhy')answers[page]={choice:r.querySelector('input[name=opt]:checked')?.value||'',reason:r.querySelector('input[name=reason]:checked')?.value||''};else if(it.type==='choicecalc')answers[page]={choice:r.querySelector('input[name=opt]:checked')?.value||'',calc:r.querySelector('input[name=calc]:checked')?.value||''};else if(it.type==='choicenumber')answers[page]={choice:r.querySelector('input[name=opt]:checked')?.value||'',number:r.querySelector('input[name=missing]')?.value||''};else answers[page]=r.querySelector('input:checked')?.value||''}

function notify(){try{parent.postMessage({source:'JPN_MODULE_V2',kind:'state',code:'MAT002',step:page,steps:items.length,complete:page>items.length,answers:items.map((it,i)=>({item:i+1,soalan:it.question,jenis:it.type,jawapan:answers[i+1]??null}))},'*')}catch(e){}}
function render(){
 const intro=page===0,end=page===items.length+1,it=items[page-1];
 document.getElementById('title').textContent='Misi Sekolah Cekap Sumber';
 document.getElementById('subtitle').textContent='Matematik · Tahun 3 · Item Interaktif';
 const root=document.getElementById('screen'),footer=document.getElementById('footer');
 if(intro){
  root.innerHTML=`<div class="intro"><span class="pill">Pengenalan</span><h2>Misi Sekolah Cekap Sumber</h2><p class="muted">Matematik · Tahun 3</p><div class="intro-content"><div class="intro-stage">${scene(0)}</div><div class="intro-copy"><p class="introtext">Sekolah mahu menghantar botol plastik ke pusat kitar semula. Sara mahu menggunakan kotak terpakai dahulu dan membeli kotak tambahan jika perlu.<br><br>Sekolah menyediakan <b>RM65</b> untuk membeli kotak baharu. Lori akan tiba pada <b>9:30 pagi</b>.</p></div></div></div>`;
  footer.innerHTML=`<span class="step">Pengenalan</span><div class="actions"><button class="btn secondary" disabled>Kembali</button><button class="btn" id="next">Seterusnya</button></div>`;
  document.getElementById('next').onclick=()=>{page=1;render()};notify();return;
 }
 if(end){
  root.innerHTML=`<div class="finish"><span class="pill">Misi Selesai!</span><h2>Syabas! 🌟</h2><p>Sara dan pasukannya telah menyelesaikan persediaan penghantaran botol ke pusat kitar semula.</p></div>`;
  footer.innerHTML=`<span class="step">Misi Selesai</span><div class="actions"><button class="btn secondary" id="home">Halaman Utama</button><button class="btn" id="again">Cuba Semula</button></div>`;
  document.getElementById('home').onclick=()=>{try{parent.postMessage({source:'JPN_MODULE_V2',kind:'home',code:'MAT002'},'*')}catch(e){}page=0;render()};
  document.getElementById('again').onclick=()=>{Object.keys(answers).forEach(k=>delete answers[k]);page=0;render()};notify();return;
 }
 const v=answers[page];let res='';
 if(it.type==='number')res=`<input class="field mission-input" type="number" inputmode="numeric" aria-label="Jawapan nombor" placeholder="Masukkan bilangan" value="${esc(v??'')}">`;
 else {
  res=`<div class="options">${it.options.map(o=>`<label class="option math-choice"><input class="choice-input" type="${it.type==='multi'?'checkbox':'radio'}" name="opt" value="${esc(o)}" ${it.type==='multi'?(Array.isArray(v)&&v.includes(o)?'checked':''):((typeof v==='string'?v:v?.choice)===o?'checked':'')}><span>${esc(o)}</span></label>`).join('')}</div>`;
  if(it.type==='singlewhy')res+=`<p class="question-tag">Mengapa kamu memilih rancangan itu?</p>${it.reasons.map(c=>`<label class="option"><input class="choice-input" type="radio" name="reason" value="${esc(c)}" ${v?.reason===c?'checked':''}><span>${esc(c)}</span></label>`).join('')}`;
  if(it.type==='choicenumber')res+=`<p class="question-tag">Bilangan botol yang tiada ruang</p><input class="field mission-input" type="number" name="missing" inputmode="numeric" placeholder="Masukkan bilangan" value="${esc(v?.number??'')}">`;
  if(it.type==='choicecalc')res+=`<p class="question-tag">Pilih pengiraan yang menyokong jawapan.</p>${it.calcs.map(c=>`<label class="option"><input class="choice-input" type="radio" name="calc" value="${esc(c)}" ${v?.calc===c?'checked':''}><span>${esc(c)}</span></label>`).join('')}`;
 }
 root.innerHTML=`<div class="grid"><section class="panel stimulus"><h2>🖼️ Bahan Rangsangan</h2><div class="stage"><div class="scene-area">${scene(page-1)}</div><div class="data">${it.data}</div></div></section><section class="panel question"><span class="pill">Cabaran ${page} daripada ${items.length}</span><h2>${esc(it.title)}</h2><p class="statement">${esc(it.question)}</p><div id="response">${res}</div>${it.type==='multi'?'<p class="subtle">Kamu boleh memilih lebih daripada satu jawapan.</p>':''}</section></div>`;
 footer.innerHTML=`<span class="step">Langkah ${page} daripada ${items.length}</span><div class="actions"><button class="btn secondary" id="back">Kembali</button><button class="btn" id="next">Seterusnya</button></div>`;
 document.getElementById('back').onclick=()=>{capture();page--;render()};
 document.getElementById('next').onclick=()=>{capture();page++;render()};
 root.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{capture();notify()}));
 notify();
}

/* JPN V2 MATHEMATICS: additive required-answer guard + safe export. */
const __matCode='MAT002';
const __matTouched=new Set();
const __matAnswered=x=>{
  if(x===null||x===undefined)return false;
  if(typeof x==='string')return x.trim()!=='';
  if(typeof x==='number')return Number.isFinite(x);
  if(typeof x==='boolean')return true;
  if(Array.isArray(x))return x.length>0&&x.every(__matAnswered);
  if(typeof x==='object')return Object.keys(x).length>0&&Object.values(x).every(__matAnswered);
  return false;
};
const __matStep=()=>page;
const __matTotal=()=>items.length;
const __matGet=(i)=>answers[i];
const __matCurrent=()=>{
  const p=__matStep();if(p<1||p>__matTotal())return true;
  const value=__matGet(p);
  // Select fields on the active screen; each distinct response must be filled.
  const root=document.getElementById('screen')||document.getElementById('app')||document.getElementById('response')||document;
  const groups=[...root.querySelectorAll('.choices[data-key]')];
  if(groups.length&&groups.some(el=>!__matAnswered((answers)[el.dataset.key])))return false;
  const typed=[...root.querySelectorAll('input[data-key],textarea[data-key]')];
  if(typed.length&&typed.some(el=>!String(el.value??'').trim()))return false;
  if(items[p-1]?.type==='order'&&!__matTouched.has(p))return false;
  if(items[p-1]?.type==='chart-dnd'){
    const expected=items[p-1]?.answer;
    if(!value||typeof value!=='object'||!expected||typeof expected!=='object')return false;
    return Object.keys(expected).every(k=>__matAnswered(value[k]));
  }
  return __matAnswered(value);
};
window.JPN_V2_ALL_COMPLETE=()=>Array.from({length:__matTotal()},(_,i)=>i+1).every(i=>{
 const v=__matGet(i); const t=items[i-1]?.type;
 if(t==='order'&&!__matTouched.has(i))return false;
 if(t==='chart-dnd'){
   const e=items[i-1]?.answer;
   return Boolean(e&&v&&Object.keys(e).every(k=>__matAnswered(v[k])));
 }
 return __matAnswered(v);
});
window.JPN_V2_EXPORT=()=>({
 unitId:__matCode,version:'mat-v2-required',page:__matStep()>__matTotal()?5:(__matStep()===0?0:1),
 answers:Object.fromEntries(Array.from({length:__matTotal()},(_,i)=>[('Q'+(i+1)+'.'+__matCode),__matGet(i+1)??null]))
});
const __matAlert=()=>{
 let a=document.getElementById('__mat_wajib_jawab_alert');
 if(!a){a=document.createElement('div');a.id='__mat_wajib_jawab_alert';a.setAttribute('role','alert');
 a.style.cssText='position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:999999;padding:13px 18px;background:#fff0c4;color:#643b00;border:2px solid #e7a62d;border-radius:12px;box-shadow:0 5px 18px #0002;font:700 15px Poppins,Arial,sans-serif;max-width:92vw;text-align:center';document.body.appendChild(a)}
 a.textContent='Sila lengkapkan semua jawapan pada langkah ini sebelum meneruskan. Jawapan tidak semestinya betul.';
 setTimeout(()=>{if(a.isConnected)a.remove()},4500);
};
// Capture BEFORE existing button click handlers. No original handler/feature is removed.
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.matches('[data-move]')&&!b.disabled)__matTouched.add(__matStep());
 if(!b.matches('#next,#goNext'))return;
 if(__matStep()===0||__matStep()>__matTotal())return;
 if(!__matCurrent()||(__matStep()===__matTotal()&&!window.JPN_V2_ALL_COMPLETE())){
   e.preventDefault();e.stopImmediatePropagation();__matAlert();
 }
},true);

render();
</script>
<script>
/* JPN PAHANG V2 - postMessage bridge compatible with current Apps Script Index.html. */
(function(){'use strict';
 const CODE='MAT002';let origin='',nonce='',last=null;
 function get(){try{return window.JPN_V2_EXPORT?.()||null}catch(e){return null}}
 function notify(force){if(!origin||!nonce)return;const v=get();if(!v)return;
  if(force||v.page!==last){last=v.page;parent.postMessage({type:'psi-page',page:v.page},origin)}}
 function collect(){if(!origin||!nonce||!window.JPN_V2_ALL_COMPLETE?.())return;
  const v=get();if(!v||v.page!==5)return;
  parent.postMessage({type:'JPN_V2_COMPLETE',moduleId:CODE,nonce,response:v},origin)}
 window.addEventListener('message',e=>{
  if(e.source!==parent||!e.data||typeof e.data!=='object')return;
  const d=e.data;
  if(d.type==='JPN_V2_INIT'&&d.moduleId===CODE&&typeof d.nonce==='string'&&d.nonce.length>=8){origin=e.origin;nonce=d.nonce;last=null;notify(true)}
  else if(d.type==='JPN_V2_COLLECT'&&e.origin===origin&&d.nonce===nonce)collect();
 });
 new MutationObserver(()=>notify(false)).observe(document.body,{childList:true,subtree:true});
})();
</script>
